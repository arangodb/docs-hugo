services:
  toolchain:
    container_name: toolchain
    # Time to remove the containers started by the toolchain on stop (see toolchain.sh)
    stop_grace_period: 30s
    image: toolchain
    build:
      context: .
      target: toolchain
    # Run in super-privileged container domain to use Docker socket
    security_opt:
      - label=type:spc_t
    tty: true
    # The default bridge instead of a network of the project, which could take the
    # address range of docs_net or docs_plain_net (the toolchain only uses docker exec)
    network_mode: bridge
    volumes:
      - ${ARANGODB_SRC_3_10:-/dev/null}:/tmp/3.10
      - ${ARANGODB_SRC_3_11:-/tmp/1}:/tmp/3.11
      - ${ARANGODB_SRC_3_12:-/tmp/2}:/tmp/3.12
      - ${ARANGODB_SRC_4_X:-/tmp/3}:/tmp/4.x
      - ../../:/home/
      - /var/run/docker.sock:/var/run/docker.sock
    # Settings come from the shell or the .env file next to this file, which the
    # toolchain updates with the settings of each local run (see toolchain.sh)
    environment:
      ENV: ${ENV:-local}
      HUGO_URL: ${HUGO_URL:-http://localhost/}
      HUGO_ENV: ${HUGO_ENV:-development}
      OVERRIDE: ${OVERRIDE:-}
      TOOLCHAIN_ENV_FILE: /home/toolchain/docker/.env
      GENERATORS: ${GENERATORS:-}
      ARANGODB_STARTER: ${ARANGODB_STARTER:-}
      EXAMPLES_SCOPE: ${EXAMPLES_SCOPE:-}
      ARANGODB_SRC_3_10: ${ARANGODB_SRC_3_10:-}
      ARANGODB_SRC_3_11: ${ARANGODB_SRC_3_11:-}
      ARANGODB_SRC_3_12: ${ARANGODB_SRC_3_12:-}
      ARANGODB_SRC_4_X: ${ARANGODB_SRC_4_X:-}
      ARANGODB_BRANCH_3_10: ${ARANGODB_BRANCH_3_10:-}
      ARANGODB_BRANCH_3_11: ${ARANGODB_BRANCH_3_11:-}
      ARANGODB_BRANCH_3_12: ${ARANGODB_BRANCH_3_12:-}
      ARANGODB_BRANCH_4_X: ${ARANGODB_BRANCH_4_X:-}
