{{- /* Served by Netlify (and hugo server) with status 404 for unknown URLs, also
       to in-app navigation, which shows it like any other page */ -}}
{{ define "main" -}}
  <article class="notfound">
    <div class="notfound-404">
      <p class="notfound-4">4</p>
      <img class="notfound-image" src="{{ "sad-avocado.png" | relURL }}" alt="" width="489" height="568">
      <p class="notfound-4">4</p>
    </div>
    <h1>Oops… Avocados are not growing here</h1>
    <p><a href="{{ site.Home.RelPermalink }}" class="link">Back to Home</a></p>
  </article>
{{- end }}
