{{- $src := .Get "src" }}
{{- $alt := .Get "alt" }}
{{- $caption := .Get "caption" }}
{{- $maxWidth := .Get "maxWidth" }}
<figure class="diagram-figure">
  <img src="{{ $src }}"
       alt="{{ $alt }}"{{ with $maxWidth }}
       style="max-width: {{ . }};"{{ end }}>
  {{- with $caption }}
  <figcaption>
    <em>{{ . | markdownify }}</em>
  </figcaption>
  {{- end }}
</figure>
