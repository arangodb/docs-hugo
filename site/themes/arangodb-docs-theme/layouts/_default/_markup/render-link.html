{{- $link := partial "resolve-link.html" (dict "link" .Destination "page" .Page) -}}
<a href="{{ $link.href | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  {{- if $link.remote }} target="_blank" rel="noopener noreferrer"{{ end }} class="link{{ if $link.remote }} link-external{{ end }}">
  {{- .Text | safeHTML -}}
</a>
{{- /* whitespace control */ -}}
