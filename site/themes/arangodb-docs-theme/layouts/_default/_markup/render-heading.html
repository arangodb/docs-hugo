{{- $ref := printf "%s#%s" .Page.RelPermalink .Anchor}}
{{- $level := .Level }}
{{- if eq .Level 1 }}
  {{- errorf "Found illegal level 1 Header in '%v' -> '%v'" .Page.RelPermalink .Text }}
  {{- $level := 2 }}
{{- end }}
<h{{ $level }} id="{{ .Anchor | safeURL }}">{{ .Text | safeHTML }}<a href="{{ $ref | safeURL }}" class="header-link" aria-label="Copy link to this section"><i class="icon icon-link" aria-hidden="true"></i></a></h{{ $level }}>
{{- .Page.Scratch.Set "currentHeadline" .Text }}
