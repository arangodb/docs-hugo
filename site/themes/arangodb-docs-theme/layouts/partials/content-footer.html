{{- $prevNext := partialCached "prev-next-map.html" . "prev-next-map" }}
{{- $url := .RelPermalink }}

<span class="prev">
{{- with index $prevNext.prev $url }}
  <a class="nav nav-prev link" href="{{ .RelPermalink }}"
    {{- with index $prevNext.prevVersions $url }} data-versions="{{ . }}"{{ end }}>
    <i class="icon icon-fw icon-chevron-left" aria-hidden="true"></i><p>{{ .Params.menuTitle | markdownify }}</p></a>
{{- end }}
</span>

<span class="next">
{{- with index $prevNext.next $url }}
  <a class="nav nav-next link" href="{{ .RelPermalink }}"
    {{- with index $prevNext.nextVersions $url }} data-versions="{{ . }}"{{ end }}>
    <p>{{ .Params.menuTitle | markdownify }}</p><i class="icon icon-fw icon-chevron-right" aria-hidden="true"></i></a>
{{- end }}
</span>
