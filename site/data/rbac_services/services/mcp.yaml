# RBAC of the mcp service, see ../roles.yaml for the structure.
order: 70
name: MCP Server of the Reasoner
page: contextual-data-platform/reasoner/_index.md
rbacPage: contextual-data-platform/reasoner/rbac.md
note: the database that the MCP server is installed for
actions:
  - name: ai:mcp.query
    summary: Use the MCP server and call its tools, except for adding templates
    resource: ai:database:<database>
    roles: [ai-user, ai-developer]
  - name: ai:mcp.template.manage
    summary: Add AQL templates
    resource: ai:database:<database>
    roles: [ai-developer]
