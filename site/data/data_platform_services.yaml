# Maps the package names used by the Arango Contextual Data Platform releases
# (the `packages` keys of the files in `data/data_platform/`) to the features
# they implement and the documentation pages that describe them.
#
# Rendered by the `service-versions` shortcode. A package that is shipped but
# not listed here makes the build warn (or fail, with `failOnBrokenLinks`), so
# add an entry HERE whenever a new service appears in a release file.
#
# Each entry has a `features` list, because a single package can ship several
# of the features that the documentation describes separately (the platform UI
# holds the Graph Visualizer and the Query Editor, the Control Plane holds the
# Secrets Manager). Conversely, several packages can contribute to one feature;
# add the part they contribute in parentheses so that the rows stay
# distinguishable and sort next to each other.
#
# Each feature:
#   name   the feature as it is called in the documentation. The first one also
#          determines where the package sorts in the rendered table.
#   link   path of the page that documents the feature, relative to the content
#          root (no leading slash). The shortcode rewrites it to a path relative
#          to the page it renders into, so the link is checked by the link
#          render hook like any other Markdown link. Optional: omit it for a
#          feature that has no page of its own, and the name is rendered as
#          plain text.

arangodb-platform-ui:
  features:
    - name: Web interface (frontend)
      link: platform-suite/_index.md
    - name: Graph Visualizer
      link: platform-suite/graph-visualizer.md
    - name: Query Editor
      link: platform-suite/query-editor.md
arangodb-platform-ui-server:
  features:
    - name: Web interface (backend)
      link: platform-suite/_index.md
arangodb-core-ui:
  features:
    # The legacy ArangoDB web interface, embedded in an iframe. It has no
    # re-implementation in the platform UI yet, so it is documented with the
    # database rather than with the platform.
    - name: Web interface (embedded legacy UI)
      link: arangodb/3.12/components/web-interface/_index.md

arangodb-core-rbac-permissions:
  features:
    - name: ArangoDB RBAC Permissions

