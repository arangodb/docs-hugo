# Single source of truth for the role-based access control (RBAC) of the
# services of the Arango Contextual Data Platform: the actions each service
# checks, the resource they are checked on, which predefined AI roles grant
# them, and which action each documented endpoint requires.
#
# Rendered by the `rbac-roles`, `rbac-actions`, `rbac-endpoints`, and
# `rbac-endpoint` shortcodes. Update the data HERE rather than editing tables
# on individual pages. Use the percent-delimited form of the shortcodes so that
# the emitted Markdown (tables and links) is rendered.
#
# This file is intentionally NOT versioned (no 3.12/4.x subfolder), like
# llm_models.yaml, because the platform services are versioned independently of
# ArangoDB.
#
# Sources (private repositories, `docs/RBAC.md` of each service). The policies
# of the predefined AI roles are shipped by the Control Plane chart
# (arangoml/GenAI-Service, charts/arango-control-plane/templates/
# predefined-role-extensions.yaml), so its RBAC.md is the reference for the
# `roles` of every action. Each service's RBAC.md is the reference for its
# endpoint mapping. Review this file when either changes.
#
# The ArangoDB core database system (`db:` actions, `coredb-*` roles) is not
# covered here. Its per-endpoint roles are maintained in the OpenAPI
# descriptions of the HTTP API via `x-rbac-predefined-roles`.
#
# Not covered on purpose:
# - MLflow (`ai:mlflow.read`, `ai:mlflow.manage` on `ai:service:arangodb-mlflow`)
#   and the MLflow artifact routes of the File Manager
#   (`ai:filemanager.artifact.manage`), because MLflow is not documented.
# - Virtual Graph and LLM fine-tuning, which are not released.
#
# Structure:
#
# roles: the predefined AI roles, in the order of the table columns.
#   name      role name without the `managed:predefined:` prefix
#   summary   one-line description
#
# resources: the kinds of resources the AI services check. Referenced by id
#   from the actions and endpoints.
#   resource  the resource pattern, with a placeholder for the name
#   scope     the label of the resource type in the scope editor of the web
#             interface, or empty if the web interface can't scope it
#   summary   what the resource stands for
#
# sharedServices: the service types that the Control Plane checks on
#   `ai:service:<type>` rather than a database. Only the `onDemand` types are
#   granted by the AI roles.
#
# services: one entry per service, in the order of the overview table.
#   name       display name
#   page       content-root-relative path of the main page of the service
#   rbacPage   content-root-relative path of the service's RBAC page, if any
#   prefix     URL path prefix of the service behind the gateway
#   resources  ids from `resources` for the Resources column of the overview,
#              if they can't be derived from the actions
#   resourceNote  where the name of the resource comes from, for all actions
#              of the service (overridden by the action and the endpoint)
#   actions    list of actions the service checks:
#     name       the action name
#     summary    what it allows
#     resource   id from `resources`
#     roles      the predefined roles that grant it
#   endpoints  the documented endpoints, matched by the `rbac-endpoint`
#              shortcode by "<method> <path>", path relative to `prefix`:
#     method, path
#     action     the required action, or empty for public endpoints
#     resource   id from `resources`; defaults to the action's resource
#     resourceNote  where the name of the resource comes from
#     roles      overrides the roles of the action for this endpoint
#     also       further actions that the request may need:
#       action, resource, when

roles:
  - name: ai-user
    summary: Uses the AI services and reads their results
  - name: ai-developer
    summary: Installs, configures, and runs the AI services and reads secrets
  - name: secret-admin
    summary: Manages the secrets that the AI services use

resources:
  database:
    resource: "ai:database:<database>"
    scope: Databases
    summary: >-
      A database, with its projects and the AI services installed for it
  service:
    resource: "ai:service:<service-type>"
    scope: Shared services
    summary: >-
      A type of shared service that is not bound to a database
  secret:
    resource: "ai:secret:store"
    scope: Secrets
    summary: >-
      All secret profiles, as a single resource
  fileparser:
    resource: "ai:fileparser:service"
    scope: ""
    summary: >-
      The File Parser, a single service of the platform

sharedServices:
  - type: arangodb-notebook-images
    name: Notebook servers
    page: contextual-data-platform/notebook-servers.md
    onDemand: true
  - type: arango-user-defined
    name: Container Manager
    page: contextual-data-platform/container-manager/_index.md
    onDemand: true
  - type: arangodb-gral
    name: Graph Analytics
    page: contextual-data-platform/graph-analytics/_index.md
    onDemand: true

services:
  - id: acp
    name: Arango Control Plane (ACP)
    page: contextual-data-platform/control-plane-acp/_index.md
    rbacPage: contextual-data-platform/control-plane-acp/rbac.md
    prefix: /_platform/acp
    resources: [database, service, secret]
    actions:
      - name: ai:acp.workspace.read
        summary: List and get projects
        resource: database
        roles: [ai-user, ai-developer]
      - name: ai:acp.workspace.manage
        summary: Create and delete projects
        resource: database
        roles: [ai-developer]
      - name: ai:acp.service.read
        summary: Get the status of a service and see it in the list of services
        resource: database
        resourceNote: >-
          or `ai:service:<service-type>` for a shared service
        roles: [ai-user, ai-developer]
      - name: ai:acp.service.manage
        summary: Install, upgrade, and uninstall services
        resource: database
        resourceNote: >-
          or `ai:service:<service-type>` for a shared service
        roles: [ai-developer]
      - name: ai:acp.secret.read
        summary: List and get secret profiles and the secret profile types
        resource: secret
        roles: [ai-developer, secret-admin]
      - name: ai:acp.secret.manage
        summary: Create, update, and delete secret profiles
        resource: secret
        roles: [secret-admin]
    endpoints:
      - method: GET
        path: /v1/health
        action: ""
      - method: POST
        path: /v1/<service-type>
        action: ai:acp.service.manage
        resource: database
        resourceNote: >-
          the `db_name` in the request for a database service, or
          `ai:service:<service-type>` for a shared service
      - method: POST
        path: /v1/graphragimporter
        action: ai:acp.service.manage
        resource: database
        resourceNote: the `db_name` in the request
      - method: POST
        path: /v1/graphragretriever
        action: ai:acp.service.manage
        resource: database
        resourceNote: the `db_name` in the request
      - method: POST
        path: /v1/autograph
        action: ai:acp.service.manage
        resource: database
        resourceNote: the `db_name` in the request
      - method: POST
        path: /v1/graphrag
        action: ai:acp.service.manage
        resource: database
        resourceNote: the `db_name` in the request
      - method: POST
        path: /v1/graphanalytics
        action: ai:acp.service.manage
        resource: service
        resourceNote: "`ai:service:arangodb-gral`"
      - method: POST
        path: /v1/notebook
        action: ai:acp.service.manage
        resource: service
        resourceNote: "`ai:service:arangodb-notebook-images`"
      - method: POST
        path: /v1/uds
        action: ai:acp.service.manage
        resource: service
        resourceNote: >-
          `ai:service:arango-user-defined`, also if you set a `db_name`
      - method: POST
        path: /v1/service
        action: ai:acp.service.manage
        resource: database
        resourceNote: >-
          the `db_name` in the request if `service_name` is a database service,
          otherwise `ai:service:<service_name>`
      - method: GET
        path: /v1/service/{service_id}
        action: ai:acp.service.read
        resourceNote: >-
          the database the service is installed for, or
          `ai:service:<service-type>` for a shared service
      - method: PUT
        path: /v1/service/{service_id}
        action: ai:acp.service.manage
        resourceNote: >-
          the database the service is installed for, or
          `ai:service:<service-type>` for a shared service
      - method: DELETE
        path: /v1/service/{service_id}
        action: ai:acp.service.manage
        resourceNote: >-
          the database the service is installed for, or
          `ai:service:<service-type>` for a shared service
      - method: POST
        path: /v1/list_services
        action: ai:acp.service.read
        resourceNote: >-
          checked per service; the response only includes the services you
          are allowed to see
      - method: POST
        path: /v1/project
        action: ai:acp.workspace.manage
        resourceNote: the `project_db_name` in the request
      - method: GET
        path: /v1/all_project_names/{project_db_name}
        action: ai:acp.workspace.read
        resourceNote: the `project_db_name` in the path
      - method: GET
        path: /v1/all_projects/{project_db_name}
        action: ai:acp.workspace.read
        resourceNote: the `project_db_name` in the path
      - method: GET
        path: /v1/project_by_name/{project_db_name}/{project_name}
        action: ai:acp.workspace.read
        resourceNote: the `project_db_name` in the path
      - method: DELETE
        path: /v1/project/{project_db_name}/{project_name}
        action: ai:acp.workspace.manage
        resourceNote: the `project_db_name` in the path
      - method: GET
        path: /v1/secret_types
        action: ai:acp.secret.read
      - method: GET
        path: /v1/secrets
        action: ai:acp.secret.read
      - method: GET
        path: /v1/secrets/{profile_id}
        action: ai:acp.secret.read
      - method: POST
        path: /v1/secrets
        action: ai:acp.secret.manage
      - method: PUT
        path: /v1/secrets/{profile_id}
        action: ai:acp.secret.manage
      - method: PATCH
        path: /v1/secrets/{profile_id}
        action: ai:acp.secret.manage
      - method: DELETE
        path: /v1/secrets/{profile_id}
        action: ai:acp.secret.manage
      - method: POST
        path: /v1/secrets_batch
        action: ai:acp.secret.manage
      - method: POST
        path: /v1/secrets_batch/delete
        action: ai:acp.secret.manage

  - id: autograph
    name: AutoGraph
    page: contextual-data-platform/autograph/_index.md
    rbacPage: contextual-data-platform/autograph/reference/rbac.md
    prefix: /autograph
    resourceNote: the database that the AutoGraph service is installed for
    actions:
      - name: ai:autograph.read
        summary: >-
          Get the status of builds, strategizer jobs, and orchestrations, read
          the strategy and the project overview
        resource: database
        roles: [ai-user, ai-developer]
      - name: ai:autograph.build
        summary: >-
          Import files, run incremental builds, strategize, orchestrate, insert
          documents, embed a field, and cancel a run
        resource: database
        roles: [ai-developer]
      - name: ai:autograph.data.manage
        summary: >-
          Run full builds, update and delete documents, edit a strategy,
          recluster, delete a category or the project's data
        resource: database
        roles: [ai-developer]
      - name: ai:autograph.config.manage
        summary: >-
          Change the model, provider, and secret profile settings that all
          users of the project share
        resource: database
        roles: [ai-developer]
    endpoints:
      - method: GET
        path: /v1/health
        action: ""
      - method: POST
        path: /v1/import-multiple
        action: ai:autograph.build
      - method: POST
        path: /v1/corpus/builds
        action: ai:autograph.build
        also:
          - action: ai:autograph.data.manage
            resource: database
            when: for a full build (`incremental` set to `false`)
      - method: GET
        path: /v1/corpus/builds/{corpus_build_id}
        action: ai:autograph.read
      - method: POST
        path: /v1/embed-field-in-collection
        action: ai:autograph.build
      - method: POST
        path: /v1/rag-strategizer/analyze
        action: ai:autograph.build
      - method: GET
        path: /v1/rag-strategizer/strategy
        action: ai:autograph.read
      - method: GET
        path: /v1/rag-strategizer/jobs/{strategize_job_id}
        action: ai:autograph.read
      - method: PATCH
        path: /v1/rag-strategizer/strategy/{cluster_id}
        action: ai:autograph.data.manage
      - method: POST
        path: /v1/orchestrate
        action: ai:autograph.build
        also:
          - action: ai:acp.secret.read
            resource: secret
            when: because the run uses secret profiles
          - action: ai:autograph.config.manage
            resource: database
            when: >-
              if the request overrides the project's model configuration
          - action: ai:acp.service.manage
            resource: database
            when: >-
              with ArangoDB RBAC disabled, together with `ai:acp.service.read`
              and `ai:acp.workspace.read`, because the run then starts
              Importer services on your behalf
      - method: GET
        path: /v1/orchestrate/{orchestration_id}
        action: ai:autograph.read
      - method: DELETE
        path: /v1/orchestrate/{orchestration_id}
        action: ai:autograph.build
      - method: POST
        path: /v1/graph/insert
        action: ai:autograph.build
      - method: POST
        path: /v1/graph/update
        action: ai:autograph.data.manage
      - method: POST
        path: /v1/graph/delete
        action: ai:autograph.data.manage
      - method: POST
        path: /v1/graph/recluster
        action: ai:autograph.data.manage
        also:
          - action: ai:acp.service.manage
            resource: database
            when: >-
              with ArangoDB RBAC disabled, together with `ai:acp.service.read`
              and `ai:acp.workspace.read`, because reclustering then starts
              Importer services on your behalf
      - method: PUT
        path: /v1/projects/{project}/model-config/credentials
        action: ai:autograph.config.manage
        also:
          - action: ai:acp.secret.read
            resource: secret
            when: because the settings name secret profiles
      - method: GET
        path: /v1/projects/{project}/overview
        action: ai:autograph.read
      - method: DELETE
        path: /v1/projects/{project}/categories/{category}
        action: ai:autograph.data.manage
      - method: DELETE
        path: /v1/projects/{project}
        action: ai:autograph.data.manage
        also:
          - action: ai:acp.workspace.manage
            resource: database
            when: >-
              together with `ai:acp.workspace.read`,
              `ai:acp.service.read`, and `ai:acp.service.manage`, because the
              Control Plane deletes the project and its services on your behalf

  - id: importer
    name: Importer
    page: contextual-data-platform/autograph/importer/_index.md
    actions:
      - name: ai:importer.read
        summary: Get the status of an import job and list the jobs
        resource: database
        roles: [ai-user, ai-developer]
      - name: ai:importer.import
        summary: Import one or more files
        resource: database
        roles: [ai-developer]
      - name: ai:importer.data.manage
        summary: Rebuild the communities of a partition and retire an import
        resource: database
        roles: [ai-developer]

  - id: retriever
    name: AutoRAG
    page: contextual-data-platform/autorag/_index.md
    actions:
      - name: ai:retriever.query
        summary: Run queries and list, get, and delete the query history
        resource: database
        roles: [ai-user, ai-developer]
      - name: ai:retriever.config.manage
        summary: Change the provider, model, and secret profile settings
        resource: database
        roles: [ai-developer]

  - id: nls
    name: Natural Language to AQL
    page: contextual-data-platform/natural-language-to-aql/_index.md
    actions:
      - name: ai:nls.ask
        summary: Send questions to the configured model without reading the database
        resource: database
        roles: [ai-user, ai-developer]
      - name: ai:nls.query
        summary: Translate questions to AQL and run the queries
        resource: database
        roles: [ai-user, ai-developer]

  - id: reasoner
    name: Reasoner
    page: contextual-data-platform/reasoner/_index.md
    actions:
      - name: ai:reasoner.query
        summary: Optimize queries and generate AQL
        resource: database
        roles: [ai-user, ai-developer]
      - name: ai:reasoner.config.manage
        summary: Register, unregister, and list the MCP servers of the Reasoner
        resource: database
        roles: [ai-developer]

  - id: mcp
    name: MCP Server
    page: contextual-data-platform/reasoner/_index.md
    actions:
      - name: ai:mcp.query
        summary: Use the MCP server and call its tools, except for adding templates
        resource: database
        roles: [ai-user, ai-developer]
      - name: ai:mcp.template.manage
        summary: Add AQL templates
        resource: database
        roles: [ai-developer]

  - id: filemanager
    name: File Manager
    page: contextual-data-platform/file-manager/_index.md
    actions:
      - name: ai:filemanager.file.read
        summary: List, browse, and download input files and their versions
        resource: database
        resourceNote: the database in the request path
        roles: [ai-user, ai-developer]
      - name: ai:filemanager.file.manage
        summary: Upload and delete input files
        resource: database
        resourceNote: the database in the request path
        roles: [ai-developer]
      - name: ai:filemanager.file.lock
        summary: Lock and unlock input files for deletion
        resource: database
        resourceNote: the database in the request path
        roles: [ai-developer]
      - name: ai:filemanager.package.read
        summary: List, get, and download Container Manager packages
        resource: service
        resourceNote: "`ai:service:arango-user-defined`"
        roles: [ai-user, ai-developer]
      - name: ai:filemanager.package.manage
        summary: Upload and delete Container Manager packages
        resource: service
        resourceNote: "`ai:service:arango-user-defined`"
        roles: [ai-developer]

  - id: fileparser
    name: File Parser
    page: contextual-data-platform/autograph/document-conversion.md
    actions:
      - name: ai:fileparser.parse
        summary: Submit files for parsing
        resource: fileparser
        roles: [ai-developer]
      - name: ai:fileparser.job.read
        summary: Get the status of parsing jobs
        resource: fileparser
        roles: [ai-developer]
