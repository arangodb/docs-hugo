<svg viewBox="0 0 900 680" width="900" height="680"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    .aai .pill-aai { fill: #befe99; stroke: #00576e; stroke-width: 1.5; }
    .aai .pill-ps  { fill: #ffffff; stroke: #90a1b9; stroke-width: 1.5; }
    .aai .pill-db  { fill: #e2e8f0; stroke: #90a1b9; stroke-width: 1.5; }
    .aai .cyl-db   { fill: #014654; stroke: #00576e; stroke-width: 2; }
    .aai .cyl-db-top { fill: #00576e; stroke: #00576e; stroke-width: 2; }
    .aai .card:hover .pill-aai { fill: #ffffff; stroke: #00576e; }
    .aai .card:hover .pill-ps  { fill: #eefbd5; stroke: #00576e; }
    .aai .card:hover .pill-db  { fill: #befe99; stroke: #00576e; }
    .aai .card:hover .cyl-db       { fill: #00576e; stroke: #befe99; }
    .aai .card:hover .cyl-db-top   { fill: #06838a; stroke: #befe99; }
  </style>
  <defs>
    <filter id="aai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aai-arrow" markerWidth="10" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0,10 4,0 8" fill="#00576e"/>
    </marker>
  </defs>

  <g class="aai">
    <rect width="900" height="680" fill="#f1f5f9" rx="6"/>

    <g class="card">
      <rect x="365" y="18" width="170" height="44" rx="22" class="pill-ps"/>
      <text x="450" y="45" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">User / Application</text>
    </g>

    <path d="M 450 64 L 450 87" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aai-arrow)"/>

    <rect x="20" y="95" width="860" height="410" rx="14" fill="#014654" stroke="#00576e" stroke-width="2" filter="url(#aai-glow)"/>
    <rect x="20" y="95" width="860" height="40" rx="14" fill="#00576e"/>
    <rect x="20" y="115" width="860" height="20" fill="#00576e"/>
    <text x="450" y="121" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Agentic AI Suite</text>

    <rect x="40" y="155" width="260" height="335" rx="12" fill="#012d3a" stroke="#00576e" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="170" y="178" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#befe99">ASK — answers in natural language</text>

    <g class="card">
      <rect x="65" y="195" width="210" height="62" rx="14" class="pill-aai"/>
      <text x="170" y="220" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Ada</text>
      <text x="170" y="240" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">AI digital assistant</text>
    </g>

    <g class="card">
      <rect x="65" y="273" width="210" height="62" rx="14" class="pill-aai"/>
      <text x="170" y="298" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">AQLizer</text>
      <text x="170" y="318" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">English to database query</text>
    </g>

    <g class="card">
      <rect x="65" y="351" width="210" height="62" rx="14" class="pill-aai"/>
      <text x="170" y="376" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Reasoner</text>
      <text x="170" y="396" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">AI query optimizer</text>
    </g>

    <rect x="320" y="155" width="280" height="335" rx="12" fill="#012d3a" stroke="#00576e" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="460" y="178" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#befe99">ANALYZE — patterns and predictions</text>

    <g class="card">
      <rect x="345" y="205" width="230" height="62" rx="14" class="pill-aai"/>
      <text x="460" y="230" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">GraphML</text>
      <text x="460" y="250" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">graph machine learning</text>
    </g>

    <g class="card">
      <rect x="345" y="295" width="230" height="78" rx="14" class="pill-aai"/>
      <text x="460" y="320" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Graph Analytics</text>
      <text x="460" y="340" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">page rank, communities,</text>
      <text x="460" y="356" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">paths</text>
    </g>

    <rect x="620" y="155" width="240" height="335" rx="12" fill="#012d3a" stroke="#00576e" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="740" y="178" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#befe99">BUILD — raw data into a graph</text>

    <g class="card">
      <rect x="645" y="205" width="190" height="78" rx="14" class="pill-aai"/>
      <text x="740" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">AutoGraph</text>
      <text x="740" y="252" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">Context Graph from</text>
      <text x="740" y="268" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">documents</text>
    </g>

    <path d="M 740 283 L 740 295.2" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aai-arrow)"/>

    <g class="card">
      <rect x="645" y="303" width="190" height="78" rx="14" class="pill-aai"/>
      <text x="740" y="330" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">AutoRAG</text>
      <text x="740" y="350" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">retrievers that answer</text>
      <text x="740" y="366" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">questions</text>
    </g>

    <path d="M 270 505 L 270 544" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aai-arrow)"/>
    <path d="M 605 505 L 605 537.2" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aai-arrow)"/>

    <g class="card">
      <ellipse cx="270" cy="565" rx="65" ry="13" class="cyl-db"/>
      <path d="M 205 565 L 205 620 A 65 13 0 0 0 335 620 L 335 565" class="cyl-db"/>
      <ellipse cx="270" cy="565" rx="65" ry="13" class="cyl-db-top"/>
      <text x="270" y="600" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">ArangoDB</text>
      <text x="270" y="618" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#befe99">multi-model database</text>
    </g>

    <g class="card">
      <rect x="510" y="545" width="190" height="90" rx="14" class="pill-db"/>
      <text x="605" y="575" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d293d">LLM provider</text>
      <text x="605" y="598" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#314158">OpenAI · Anthropic ·</text>
      <text x="605" y="614" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#314158">Custom</text>
    </g>
  </g>
</svg>
