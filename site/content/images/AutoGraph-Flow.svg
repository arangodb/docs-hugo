<svg viewBox="0 0 1380 400"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;max-width:1380px;margin:0 auto">
  <style>
    .agf .pill-aai { fill: #b9f5a0; stroke: #4ade80; stroke-width: 1.5; }
    .agf .pill-ps  { fill: #ffffff; stroke: #86efac; stroke-width: 1.5; }
    .agf .cyl-db   { fill: #0b2e1e; stroke: #22c55e; stroke-width: 2; }
    .agf .cyl-db-top { fill: #134d2e; stroke: #22c55e; stroke-width: 2; }
    .agf .cyl-llm  { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.5; }
    .agf .cyl-llm-top { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .agf .card:hover .pill-aai     { fill: #ffffff; stroke: #22c55e; }
    .agf .card:hover .pill-ps      { fill: #dcfce7; stroke: #22c55e; }
    .agf .card:hover .cyl-db       { fill: #134d2e; stroke: #b9ff38; }
    .agf .card:hover .cyl-db-top   { fill: #1a5e38; stroke: #b9ff38; }
    .agf .card:hover .cyl-llm      { fill: #b9ff38; stroke: #22c55e; }
    .agf .card:hover .cyl-llm-top  { fill: #dcfce7; stroke: #22c55e; }
  </style>
  <defs>
    <filter id="agf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="agf-arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0,10 4,0 8" fill="#4ade80"/>
    </marker>
  </defs>

  <g class="agf">
    <rect width="1380" height="400" fill="#f3f4f6" rx="6"/>

    <rect x="20" y="50" width="640" height="330" rx="14" fill="#ffffff" fill-opacity="0.55" stroke="#86efac" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">STAGE 1 · AUTOGRAPH — build the Context Graph</text>

    <rect x="676" y="50" width="684" height="330" rx="14" fill="#ffffff" fill-opacity="0.55" stroke="#86efac" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="1018" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">STAGE 2 · AUTORAG — answer questions from it</text>

    <g class="card">
      <rect x="44" y="155" width="166" height="90" rx="14" class="pill-ps"/>
      <text x="127" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">Your documents</text>
      <text x="127" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#14532d">PDF, Office, Text,</text>
      <text x="127" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#14532d">Markdown</text>
    </g>

    <path d="M 210 200 L 246 200" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#agf-arrow)"/>

    <g class="card">
      <rect x="248" y="155" width="176" height="90" rx="14" class="pill-aai" filter="url(#agf-glow)"/>
      <text x="336" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0b2e1e">AutoGraph</text>
      <text x="336" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#0b2e1e">clusters documents,</text>
      <text x="336" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#0b2e1e">assigns strategies</text>
    </g>

    <path d="M 424 200 L 460 200" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#agf-arrow)"/>

    <rect x="462" y="96" width="186" height="250" rx="12" fill="#082016" stroke="#4ade80" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="555" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b9ff38">Context Graph</text>

    <g class="card">
      <path d="M 480 148 L 480 200 A 75 14 0 0 0 630 200 L 630 148" class="cyl-db"/>
      <ellipse cx="555" cy="148" rx="75" ry="14" class="cyl-db-top"/>
      <text x="555" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Corpus Graph</text>
      <text x="555" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#b9ff38">topic domains</text>
    </g>

    <path d="M 555 218 L 555 240" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#agf-arrow)"/>

    <g class="card">
      <path d="M 480 252 L 480 304 A 75 14 0 0 0 630 304 L 630 252" class="cyl-db"/>
      <ellipse cx="555" cy="252" rx="75" ry="14" class="cyl-db-top"/>
      <text x="555" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Knowledge Graph</text>
      <text x="555" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#b9ff38">entities + embeddings</text>
    </g>

    <path d="M 650 200 L 694 200" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#agf-arrow)"/>

    <g class="card">
      <rect x="698" y="155" width="186" height="90" rx="14" class="pill-aai" filter="url(#agf-glow)"/>
      <text x="791" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0b2e1e">AutoRAG retriever</text>
      <text x="791" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#0b2e1e">finds the relevant</text>
      <text x="791" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#0b2e1e">context</text>
    </g>

    <path d="M 884 200 L 918 200" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#agf-arrow)"/>

    <g class="card">
      <path d="M 920 172 L 920 228 A 75 14 0 0 0 1070 228 L 1070 172" class="cyl-llm"/>
      <ellipse cx="995" cy="172" rx="75" ry="14" class="cyl-llm-top"/>
      <text x="995" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">LLM provider</text>
      <text x="995" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#374151">generates answer</text>
    </g>

    <path d="M 1070 200 L 1188 200" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#agf-arrow)"/>
    <rect x="1082" y="176" width="100" height="16" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>
    <text x="1132" y="188" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">grounded answer</text>

    <g class="card">
      <rect x="1192" y="155" width="146" height="90" rx="14" class="pill-ps"/>
      <text x="1265" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">User / Agent</text>
      <text x="1265" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#14532d">asks a question</text>
    </g>

    <path d="M 1265 245 L 1265 332 L 791 332 L 791 245" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#agf-arrow)"/>
    <rect x="995" y="324" width="60" height="16" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>
    <text x="1025" y="336" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">question</text>
  </g>
</svg>
