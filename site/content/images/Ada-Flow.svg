<svg viewBox="0 0 1080 290" width="1080" height="290"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    .ada .pill-aai { fill: #befe99; stroke: #00576e; stroke-width: 1.5; }
    .ada .pill-ps  { fill: #ffffff; stroke: #90a1b9; stroke-width: 1.5; }
    .ada .cyl-db   { fill: #014654; stroke: #00576e; stroke-width: 2; }
    .ada .cyl-db-top { fill: #00576e; stroke: #00576e; stroke-width: 2; }
    .ada .cyl-llm  { fill: #e2e8f0; stroke: #90a1b9; stroke-width: 1.5; }
    .ada .cyl-llm-top { fill: #f1f5f9; stroke: #90a1b9; stroke-width: 1.5; }
    .ada .card:hover .pill-aai     { fill: #ffffff; stroke: #00576e; }
    .ada .card:hover .pill-ps      { fill: #eefbd5; stroke: #00576e; }
    .ada .card:hover .cyl-db       { fill: #00576e; stroke: #befe99; }
    .ada .card:hover .cyl-db-top   { fill: #06838a; stroke: #befe99; }
    .ada .card:hover .cyl-llm      { fill: #befe99; stroke: #00576e; }
    .ada .card:hover .cyl-llm-top  { fill: #eefbd5; stroke: #00576e; }
  </style>
  <defs>
    <filter id="ada-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ada-arrow" markerWidth="10" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0,10 4,0 8" fill="#00576e"/>
    </marker>
  </defs>

  <g class="ada">
    <rect width="1080" height="290" fill="#f1f5f9" rx="6"/>

    <g class="card">
      <rect x="30" y="120" width="180" height="100" rx="14" class="pill-ps"/>
      <text x="120" y="160" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">User</text>
      <text x="120" y="185" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">asks in plain English</text>
    </g>

    <g class="card">
      <rect x="290" y="10" width="200" height="100" rx="14" class="pill-aai" filter="url(#ada-glow)"/>
      <text x="390" y="50" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Ada UI</text>
      <text x="390" y="75" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">chat in your browser</text>
    </g>

    <g class="card">
      <rect x="550" y="120" width="210" height="100" rx="14" class="pill-aai" filter="url(#ada-glow)"/>
      <text x="655" y="160" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Ada Engine</text>
      <text x="655" y="185" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">plans + uses tools</text>
    </g>

    <g class="card">
      <path d="M 870 26 L 870 90 A 70 14 0 0 0 1010 90 L 1010 26" class="cyl-db"/>
      <ellipse cx="940" cy="26" rx="70" ry="14" class="cyl-db-top"/>
      <text x="940" y="66" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">ArangoDB</text>
      <text x="940" y="86" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#befe99">your data</text>
    </g>

    <g class="card">
      <path d="M 870 136 L 870 200 A 70 14 0 0 0 1010 200 L 1010 136" class="cyl-llm"/>
      <ellipse cx="940" cy="136" rx="70" ry="14" class="cyl-llm-top"/>
      <text x="940" y="187" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d293d">LLM provider</text>
    </g>

    <path d="M 175 120 L 175 60 L 282.2 60" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#ada-arrow)"/>
    <rect x="200" y="42" width="46" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="223" y="54" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">question</text>

    <path d="M 490 60 L 615 60 L 615 112.2" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#ada-arrow)"/>

    <path d="M 548 170 L 217.8 170" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#ada-arrow)"/>
    <rect x="335" y="158" width="80" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="375" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">reply + chart</text>

    <path d="M 720 120 L 720 60 L 862 60" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#ada-arrow)"/>
    <rect x="745" y="42" width="110" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="800" y="54" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">reads schema + data</text>

    <path d="M 760 162 L 862.2 162" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#ada-arrow)"/>
    <rect x="785" y="146" width="48" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="809" y="158" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">prompt</text>

    <path d="M 868 188 L 767.8 188" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#ada-arrow)"/>
    <rect x="785" y="194" width="48" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="809" y="206" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">answer</text>
  </g>
</svg>
