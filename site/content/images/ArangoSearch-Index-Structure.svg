<svg viewBox="0 0 760 490"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;max-width:760px;margin:0 auto">
  <style>
    .asx .seg     { fill: #ffffff; stroke: #86efac; stroke-width: 1.5; }
    .asx .part    { fill: #ecfccb; stroke: #86efac; stroke-width: 1; }
    .asx .meta    { fill: #b9f5a0; stroke: #4ade80; stroke-width: 1.5; }
    .asx .h       { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #14532d; }
    .asx .l       { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #14532d; }
    .asx .card:hover .seg     { fill: #f7fee7; stroke: #22c55e; }
    .asx .card:hover .part    { fill: #dcfce7; stroke: #22c55e; }
    .asx .card:hover .meta    { fill: #ffffff; stroke: #22c55e; }
  </style>

  <g class="asx">
    <rect width="760" height="490" fill="#f3f4f6" rx="6"/>

    <rect x="20" y="46" width="720" height="420" rx="14" fill="#ffffff" fill-opacity="0.55"
          stroke="#86efac" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="380" y="72" text-anchor="middle" class="h">ArangoSearch data store</text>
    <text x="380" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">one per link or inverted index</text>

    <g class="card">
      <rect x="40" y="104" width="200" height="300" rx="10" class="seg"/>
      <text x="140" y="128" text-anchor="middle" class="h">Segment 0</text>
      <rect x="52" y="138" width="176" height="42" rx="6" class="part"/>
      <text x="140" y="164" text-anchor="middle" class="l">Term dictionary</text>
      <rect x="52" y="190" width="176" height="42" rx="6" class="part"/>
      <text x="140" y="216" text-anchor="middle" class="l">Posting lists</text>
      <rect x="52" y="242" width="176" height="42" rx="6" class="part"/>
      <text x="140" y="268" text-anchor="middle" class="l">Segment metadata</text>
      <rect x="52" y="294" width="176" height="42" rx="6" class="part"/>
      <text x="140" y="320" text-anchor="middle" class="l">Tombstones</text>
      <rect x="52" y="346" width="176" height="42" rx="6" class="part"/>
      <text x="140" y="372" text-anchor="middle" class="l">Column store</text>
    </g>

    <g class="card">
      <rect x="280" y="104" width="200" height="300" rx="10" class="seg"/>
      <text x="380" y="128" text-anchor="middle" class="h">Segment 1</text>
      <rect x="292" y="138" width="176" height="42" rx="6" class="part"/>
      <text x="380" y="164" text-anchor="middle" class="l">Term dictionary</text>
      <rect x="292" y="190" width="176" height="42" rx="6" class="part"/>
      <text x="380" y="216" text-anchor="middle" class="l">Posting lists</text>
      <rect x="292" y="242" width="176" height="42" rx="6" class="part"/>
      <text x="380" y="268" text-anchor="middle" class="l">Segment metadata</text>
      <rect x="292" y="294" width="176" height="42" rx="6" class="part"/>
      <text x="380" y="320" text-anchor="middle" class="l">Tombstones</text>
      <rect x="292" y="346" width="176" height="42" rx="6" class="part"/>
      <text x="380" y="372" text-anchor="middle" class="l">Column store</text>
    </g>

    <text x="500" y="260" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4ade80">&#8943;</text>

    <g class="card">
      <rect x="520" y="104" width="200" height="300" rx="10" class="seg"/>
      <text x="620" y="128" text-anchor="middle" class="h">Segment N</text>
      <rect x="532" y="138" width="176" height="42" rx="6" class="part"/>
      <text x="620" y="164" text-anchor="middle" class="l">Term dictionary</text>
      <rect x="532" y="190" width="176" height="42" rx="6" class="part"/>
      <text x="620" y="216" text-anchor="middle" class="l">Posting lists</text>
      <rect x="532" y="242" width="176" height="42" rx="6" class="part"/>
      <text x="620" y="268" text-anchor="middle" class="l">Segment metadata</text>
      <rect x="532" y="294" width="176" height="42" rx="6" class="part"/>
      <text x="620" y="320" text-anchor="middle" class="l">Tombstones</text>
      <rect x="532" y="346" width="176" height="42" rx="6" class="part"/>
      <text x="620" y="372" text-anchor="middle" class="l">Column store</text>
    </g>

    <g class="card">
      <rect x="40" y="416" width="680" height="34" rx="8" class="meta"/>
      <text x="380" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b2e1e">Index metadata &#183; which segments form the committed state</text>
    </g>
  </g>
</svg>
