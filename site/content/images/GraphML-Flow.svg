<svg viewBox="0 0 1380 360" width="1380" height="360"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    .gml .pill-aai { fill: #befe99; stroke: #00576e; stroke-width: 1.5; }
    .gml .pill-ps  { fill: #ffffff; stroke: #90a1b9; stroke-width: 1.5; }
    .gml .cyl-db   { fill: #014654; stroke: #00576e; stroke-width: 2; }
    .gml .cyl-db-top { fill: #00576e; stroke: #00576e; stroke-width: 2; }
    .gml .card:hover .pill-aai     { fill: #ffffff; stroke: #00576e; }
    .gml .card:hover .pill-ps      { fill: #eefbd5; stroke: #00576e; }
    .gml .card:hover .cyl-db       { fill: #00576e; stroke: #befe99; }
    .gml .card:hover .cyl-db-top   { fill: #06838a; stroke: #befe99; }
  </style>
  <defs>
    <filter id="gml-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="gml-arrow" markerWidth="10" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0,10 4,0 8" fill="#00576e"/>
    </marker>
  </defs>

  <g class="gml">
    <rect width="1380" height="360" fill="#f1f5f9" rx="6"/>

    <g class="card">
      <rect x="30" y="70" width="180" height="100" rx="14" class="pill-ps"/>
      <text x="120" y="110" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">User</text>
      <text x="120" y="135" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">picks graph + task</text>
    </g>

    <path d="M 210 120 L 252.2 120" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#gml-arrow)"/>
    <rect x="216" y="98" width="38" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="235" y="110" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">select</text>

    <g class="card">
      <rect x="260" y="70" width="200" height="100" rx="14" class="pill-aai" filter="url(#gml-glow)"/>
      <text x="360" y="105" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Prepare</text>
      <text x="360" y="128" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">turn graph data into</text>
      <text x="360" y="143" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">AI-ready format</text>
    </g>

    <path d="M 460 120 L 532.2 120" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#gml-arrow)"/>

    <g class="card">
      <rect x="540" y="70" width="200" height="100" rx="14" class="pill-aai" filter="url(#gml-glow)"/>
      <text x="640" y="115" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Train</text>
      <text x="640" y="138" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">learn from your graph</text>
    </g>

    <path d="M 740 120 L 812.2 120" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#gml-arrow)"/>

    <g class="card">
      <rect x="820" y="70" width="220" height="100" rx="14" class="pill-aai" filter="url(#gml-glow)"/>
      <text x="930" y="105" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Predict</text>
      <text x="930" y="128" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">classify nodes, find</text>
      <text x="930" y="143" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">similar items</text>
    </g>

    <path d="M 1040 120 L 1147 120" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#gml-arrow)"/>
    <rect x="1058" y="98" width="68" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="1092" y="110" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">saved back</text>

    <g class="card">
      <path d="M 1155 87 L 1155 152 A 75 16 0 0 0 1305 152 L 1305 87" class="cyl-db"/>
      <ellipse cx="1230" cy="87" rx="75" ry="16" class="cyl-db-top"/>
      <text x="1230" y="129" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">ArangoDB</text>
      <text x="1230" y="149" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#befe99">your graph data</text>
    </g>

    <path d="M 930 170 L 930 230 L 120 230 L 120 177.8" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#gml-arrow)"/>
    <rect x="475" y="222" width="100" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="525" y="234" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">labels + insights</text>

    <path d="M 1230 168 L 1230 300 L 360 300 L 360 177.8" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#gml-arrow)"/>
  </g>
</svg>
