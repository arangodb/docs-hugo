<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1238" width="900" height="1238" role="img" aria-labelledby="us-title us-desc">
  <title id="us-title">Unified Search architecture</title>
  <desc id="us-desc">A unified query is normalized and then retrieved in parallel: chunks with hybrid lexical and semantic search fused by RRF, and entities with local entity-centric retrieval. Both result sets are tagged, scored, merged into unified nodes, and used to generate the answer.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .ftitle { font-size: 15px; font-weight: 700; fill: #334155; }
    .box { stroke-width: 2; }
    .btitle { font-size: 13.5px; font-weight: 700; }
    .bullet { font-size: 12.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.75; }
    .elabel { font-size: 11px; fill: #475569; }
    .lbg-page { fill: #ffffff; }
    .lbg-frame { fill: #f8fafc; }
  </style>
  <defs>
    <marker id="us-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="1238" fill="#ffffff"/>
  <rect class="frame" x="16" y="96.0" width="868" height="671.0" rx="10"/>
  <text class="ftitle" x="450.0" y="124.0" text-anchor="middle">1. Parallel Retrieval: Chunks (Hybrid) + Local Entities</text>
  <rect class="frame" x="16" y="827.0" width="868" height="393.0" rx="10"/>
  <text class="ftitle" x="450.0" y="855.0" text-anchor="middle">2. Unified Nodes &amp; Direct Answer</text>
  <rect class="box" x="47.0" y="20" width="200" height="40" rx="20" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="btitle" x="147.0" y="45" text-anchor="middle">Unified Query (text)</text>
  <path class="edge" d="M147.0,60.0 L147.0,145.0" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M250.0,213.5 L346.0,213.5" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M553.0,213.5 L649.0,213.5" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M147.0,281.0 L147.0,418.5" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M250.0,461.0 L290.5,461.0 Q298.5,461.0 298.5,453.0 L298.5,403.0 Q298.5,395.0 306.5,395.0 L346.0,395.0" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M250.0,461.0 L290.5,461.0 Q298.5,461.0 298.5,469.0 L298.5,519.0 Q298.5,527.0 306.5,527.0 L346.0,527.0" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M553.0,395.0 L593.5,395.0 Q601.5,395.0 601.5,403.0 L601.5,453.0 Q601.5,461.0 609.5,461.0 L649.0,461.0" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M553.0,527.0 L593.5,527.0 Q601.5,527.0 601.5,519.0 L601.5,469.0 Q601.5,461.0 609.5,461.0 L649.0,461.0" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M753.0,512.0 L753.0,601.0 Q753.0,609.0 745.0,609.0 L155.0,609.0 Q147.0,609.0 147.0,617.0 L147.0,640.0" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M250.0,692.0 L346.0,692.0" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M856.0,213.5 L863.0,213.5 Q870.0,213.5 870.0,221.5 L870.0,789.0 Q870.0,797.0 862.0,797.0 L155.0,797.0 Q147.0,797.0 147.0,805.0 L147.0,876.0" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M450.0,743.0 L450.0,797.0"/>
  <rect class="lbg-page" x="658.4" y="788.0" width="83.2" height="18" rx="3"/>
  <text class="elabel" x="700.0" y="801.0" text-anchor="middle">entity nodes</text>
  <rect class="lbg-page" x="229.4" y="788.0" width="138.1" height="18" rx="3"/>
  <text class="elabel" x="298.5" y="801.0" text-anchor="middle">chunks + entity nodes</text>
  <text class="elabel" x="460.0" y="778.0">chunks</text>
  <path class="edge" d="M250.0,945.5 L346.0,945.5" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M553.0,945.5 L649.0,945.5" marker-end="url(#us-arrow)"/>
  <path class="edge" d="M753.0,1014.0 L753.0,1038.0 Q753.0,1046.0 745.0,1046.0 L155.0,1046.0 Q147.0,1046.0 147.0,1054.0 L147.0,1077.0" marker-end="url(#us-arrow)"/>
  <rect class="box" x="44" y="146.0" width="206" height="135.0" rx="8" fill="#f3e8ff" stroke="#7e22ce"/>
  <text class="btitle" x="56" y="189.5">Normalize query &amp; limits</text>
  <text class="bullet" x="56" y="212.5">•</text>
  <text class="bullet" x="66" y="212.5">Validate / truncate text</text>
  <text class="bullet" x="56" y="231.5">•</text>
  <text class="bullet" x="66" y="231.5">Set chunk/entity limits</text>
  <text class="bullet" x="66" y="247.5">&amp; filtering flags</text>
  <rect class="box" x="347" y="146.0" width="206" height="135.0" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text class="btitle" x="359" y="173.0">Entity-centric retrieval</text>
  <text class="btitle" x="359" y="190.0">(LOCAL)</text>
  <text class="bullet" x="359" y="213.0">•</text>
  <text class="bullet" x="369" y="213.0">Hybrid entity search</text>
  <text class="bullet" x="369" y="229.0">(lexical + semantic)</text>
  <text class="bullet" x="359" y="248.0">•</text>
  <text class="bullet" x="369" y="248.0">Fallback to vector-only</text>
  <text class="bullet" x="369" y="264.0">if needed</text>
  <rect class="box" x="650" y="146.0" width="206" height="135.0" rx="8" fill="#fce7f3" stroke="#be185d"/>
  <text class="btitle" x="662" y="191.0">Entity centric nodes</text>
  <text class="bullet" x="662" y="214.0">•</text>
  <text class="bullet" x="672" y="214.0">Per-entity bundles with</text>
  <text class="bullet" x="672" y="230.0">chunks, reports,</text>
  <text class="bullet" x="672" y="246.0">relations</text>
  <rect class="box" x="44" y="419.5" width="206" height="83.0" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text class="btitle" x="56" y="446.5">Encode query for chunks</text>
  <text class="bullet" x="56" y="469.5">•</text>
  <text class="bullet" x="66" y="469.5">Generate dense</text>
  <text class="bullet" x="66" y="485.5">embedding once</text>
  <rect class="box" x="347" y="345.0" width="206" height="100.0" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text class="btitle" x="359" y="380.5">Lexical search on chunks</text>
  <text class="bullet" x="359" y="403.5">•</text>
  <text class="bullet" x="369" y="403.5">BM25 on content/chunk</text>
  <text class="bullet" x="369" y="419.5">fields</text>
  <rect class="box" x="347" y="477.0" width="206" height="100.0" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text class="btitle" x="359" y="504.0">Semantic search on</text>
  <text class="btitle" x="359" y="521.0">chunks</text>
  <text class="bullet" x="359" y="544.0">•</text>
  <text class="bullet" x="369" y="544.0">ANN over chunk</text>
  <text class="bullet" x="369" y="560.0">embeddings</text>
  <rect class="box" x="650" y="410.0" width="206" height="102.0" rx="8" fill="#fce7f3" stroke="#be185d"/>
  <text class="btitle" x="662" y="437.0">RRF fusion for chunks</text>
  <text class="bullet" x="662" y="460.0">•</text>
  <text class="bullet" x="672" y="460.0">Combine lexical +</text>
  <text class="bullet" x="672" y="476.0">semantic scores</text>
  <text class="bullet" x="662" y="495.0">•</text>
  <text class="bullet" x="672" y="495.0">Keep top-N chunk docs</text>
  <rect class="box" x="44" y="641.0" width="206" height="102.0" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text class="btitle" x="56" y="677.5">Text-only chunk fallback</text>
  <text class="bullet" x="56" y="700.5">•</text>
  <text class="bullet" x="66" y="700.5">If Hybrid fails or</text>
  <text class="bullet" x="66" y="716.5">empty</text>
  <rect class="box" x="347" y="641.0" width="206" height="102.0" rx="8" fill="#fce7f3" stroke="#be185d"/>
  <text class="btitle" x="359" y="668.0">Chunk candidates</text>
  <text class="bullet" x="359" y="691.0">•</text>
  <text class="bullet" x="369" y="691.0">Scored chunk docs</text>
  <text class="bullet" x="359" y="710.0">•</text>
  <text class="bullet" x="369" y="710.0">With stable_url via</text>
  <text class="bullet" x="369" y="726.0">PART_OF</text>
  <rect class="box" x="44" y="877.0" width="206" height="137.0" rx="8" fill="#f3e8ff" stroke="#7e22ce"/>
  <text class="btitle" x="56" y="913.5">Tag and score docs</text>
  <text class="bullet" x="56" y="936.5">•</text>
  <text class="bullet" x="66" y="936.5">Mark type =</text>
  <text class="bullet" x="66" y="952.5">chunk/entity</text>
  <text class="bullet" x="56" y="971.5">•</text>
  <text class="bullet" x="66" y="971.5">Assign unified_score</text>
  <text class="bullet" x="66" y="987.5">per item</text>
  <rect class="box" x="347" y="877.0" width="206" height="137.0" rx="8" fill="#f3e8ff" stroke="#7e22ce"/>
  <text class="btitle" x="359" y="921.5">Merge and sort</text>
  <text class="bullet" x="359" y="944.5">•</text>
  <text class="bullet" x="369" y="944.5">Combine chunks +</text>
  <text class="bullet" x="369" y="960.5">entities</text>
  <text class="bullet" x="359" y="979.5">•</text>
  <text class="bullet" x="369" y="979.5">Sorted unified list</text>
  <rect class="box" x="650" y="877.0" width="206" height="137.0" rx="8" fill="#fce7f3" stroke="#be185d"/>
  <text class="btitle" x="662" y="904.0">Unified nodes</text>
  <text class="bullet" x="662" y="927.0">•</text>
  <text class="bullet" x="672" y="927.0">Entity-style nodes for</text>
  <text class="bullet" x="672" y="943.0">all items</text>
  <text class="bullet" x="662" y="962.0">•</text>
  <text class="bullet" x="672" y="962.0">Attach chunk + metadata</text>
  <text class="bullet" x="662" y="981.0">•</text>
  <text class="bullet" x="672" y="981.0">Deduplicate chunks</text>
  <text class="bullet" x="672" y="997.0">where possible</text>
  <rect class="box" x="44" y="1078.0" width="206" height="118.0" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text class="btitle" x="56" y="1105.0">Unified response</text>
  <text class="bullet" x="56" y="1128.0">•</text>
  <text class="bullet" x="66" y="1128.0">Uses unified nodes as</text>
  <text class="bullet" x="66" y="1144.0">context</text>
  <text class="bullet" x="56" y="1163.0">•</text>
  <text class="bullet" x="66" y="1163.0">Generate final grounded</text>
  <text class="bullet" x="66" y="1179.0">answer</text>
</svg>
