  <title id="smartgraph-distribution-t">SmartGraph domain-based distribution</title>
  <desc id="smartgraph-distribution-d">One graph sharded across the three DB-Servers of a cluster. Each domain keeps its nodes and edges together on one DB-Server. Each DB-Server also shows, dotted, the nodes and edges stored on the other DB-Servers.</desc>
  <style>
    /* Dark mode of the docs: domain B in slate 300, apart from the original
       distribution (no diagram role in dark.css has this color) */
    :root[data-theme="dark"] .dg-sgd .dom-b { fill: #cad5e2; }
    :root[data-theme="dark"] .dg-sgd line.dom-b { stroke: #cad5e2; }
  </style>
