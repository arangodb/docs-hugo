  <style>
    .igud text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .igud .panel { fill: #eefbd5; stroke: #cad5e2; stroke-width: 1.5; }
    .igud .ptitle { font-size: 13.5px; font-weight: 700; fill: #014654; }
    .igud .psub { font-size: 11px; fill: #45556c; }
    .igud .edge { stroke: #cad5e2; stroke-width: 1.5; }
    .igud .edge-new { stroke: #008236; stroke-width: 2; stroke-dasharray: 4 3; }
    .igud .edge-gone { stroke: #cad5e2; stroke-width: 1.2; stroke-dasharray: 2 3; }
    .igud .node { fill: #014654; stroke: #014654; stroke-width: 1.5; }
    .igud .node-new { fill: #008236; stroke: #008236; stroke-width: 1.5; }
    .igud .node-del { fill: #bb4d00; stroke: #bb4d00; stroke-width: 1.5; }
    .igud .node-gone { fill: #ffffff; stroke: #cad5e2; stroke-width: 1.5; stroke-dasharray: 2 2; }
    .igud .ring { fill: none; stroke: #008236; stroke-width: 1.5; stroke-dasharray: 3 2; }
    .igud .legend { font-size: 12px; fill: #45556c; }
    .igud .note { font-size: 11px; fill: #45556c; }
