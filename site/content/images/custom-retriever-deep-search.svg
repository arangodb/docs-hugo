<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1270" width="940" height="1270" role="img" aria-labelledby="custom-retriever-deep-search-t custom-retriever-deep-search-d" font-family="Urbanist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="custom-retriever-deep-search-t">Custom Deep Search</title>
  <desc id="custom-retriever-deep-search-d">The tool list is resolved, global context is read from community reports, the LLM creates a multi-step plan and matches tools in two passes. Each step fills its query template from earlier results, runs the matched tools and runs a completion check, looping to the next step until done. The step results are then synthesized into the answer. When global context is empty, tools are matched directly, run in parallel, summarized and synthesized.</desc>
  <defs><marker id="custom-retriever-deep-search-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f6d8b"/></marker></defs>
  <rect x="0" y="0" width="940" height="1270" fill="#ffffff"/>
  <rect x="60" y="610" width="400" height="393" rx="12" fill="#f4faf4" stroke="#cfe3d3" stroke-width="1.5"/>
  <text x="78" y="634" font-size="13.5" font-weight="700" fill="#044926">4. Execute the steps in order</text>
  <polyline points="250,101 250,141" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <polyline points="250,222 250,262" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="259" y="246" font-size="11" font-weight="600" fill="#044926" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tool ids</text>
  <polyline points="250,328 250,368" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="259" y="352" font-size="11" font-weight="600" fill="#044926" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">context found</text>
  <polyline points="400,295 710,295 710,368" fill="none" stroke="#4f6d8b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="555" y="289" font-size="11" font-weight="600" fill="#044926" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">empty / no communities</text>
  <polyline points="250,449 250,489" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <polyline points="250,570 250,610" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="259" y="594" font-size="11" font-weight="600" fill="#044926" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">matched tool ids</text>
  <polyline points="250,731 250,771" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <polyline points="250,852 250,892" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="259" y="876" font-size="11" font-weight="600" fill="#044926" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">step result + citations</text>
  <polyline points="400,932.5 432,932.5 432,690.5 400,690.5" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="444" y="811" font-size="11" font-weight="600" fill="#044926" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" transform="rotate(-90 444 811)">next step</text>
  <polyline points="250,1003 250,1043" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="259" y="1027" font-size="11" font-weight="600" fill="#044926" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">all step results</text>
  <polyline points="250,1124 250,1164" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="259" y="1148" font-size="11" font-weight="600" fill="#044926" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">final answer</text>
  <polyline points="710,434 710,489" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="719" y="465.5" font-size="11" font-weight="600" fill="#044926" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tool ids</text>
  <polyline points="710,540 710,650" fill="none" stroke="#4f6d8b" stroke-width="1.6" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="719" y="599" font-size="11" font-weight="600" fill="#044926" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">results</text>
  <polyline points="710,716 710,1197 400,1197" fill="none" stroke="#4f6d8b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#custom-retriever-deep-search-arrow)"/>
  <text x="702" y="955" font-size="11" font-weight="600" fill="#044926" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" transform="rotate(-90 702 955)">direct path answer</text>
  <rect x="100" y="20" width="300" height="81" rx="22" fill="#044926" stroke="#044926" stroke-width="1.6"/>
  <text x="114" y="42" font-size="13" font-weight="700" fill="#ffffff">Query request</text>
  <text x="114" y="60" font-size="11.5" fill="#cfe3d3">query_type = CUSTOM + use_llm_planner = true</text>
  <text x="114" y="75" font-size="11.5" fill="#cfe3d3">or mode = DEEP_SEARCH</text>
  <text x="114" y="90" font-size="11.5" fill="#cfe3d3">custom_tools optional</text>
  <rect x="100" y="141" width="300" height="81" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6"/>
  <text x="114" y="163" font-size="13" font-weight="700" fill="#151d25">Resolve the tool list</text>
  <text x="114" y="181" font-size="11.5" fill="#4f6d8b">custom_tools given → use that list</text>
  <text x="114" y="196" font-size="11.5" fill="#4f6d8b">else load every custom_retriever, local,</text>
  <text x="114" y="211" font-size="11.5" fill="#4f6d8b">global and unified tool from Tools</text>
  <rect x="364.8" y="148" width="26.2" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="377.90000000000003" y="159.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">DB</text>
  <rect x="100" y="262" width="300" height="66" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6"/>
  <text x="114" y="284" font-size="13" font-weight="700" fill="#151d25">1. Global context</text>
  <text x="114" y="302" font-size="11.5" fill="#4f6d8b">GLOBAL query over community reports</text>
  <text x="114" y="317" font-size="11.5" fill="#4f6d8b">tells the planner what data exists</text>
  <rect x="358.7" y="269" width="32.3" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="374.84999999999997" y="280.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">LLM</text>
  <rect x="100" y="368" width="300" height="81" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6"/>
  <text x="114" y="390" font-size="13" font-weight="700" fill="#151d25">2. Create the plan</text>
  <text x="114" y="408" font-size="11.5" fill="#4f6d8b">N steps: description, query template,</text>
  <text x="114" y="423" font-size="11.5" fill="#4f6d8b">expected info · later steps can reuse</text>
  <text x="114" y="438" font-size="11.5" fill="#4f6d8b">earlier results</text>
  <rect x="358.7" y="375" width="32.3" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="374.84999999999997" y="386.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">LLM</text>
  <rect x="100" y="489" width="300" height="81" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6"/>
  <text x="114" y="511" font-size="13" font-weight="700" fill="#151d25">3. Match tools (two passes)</text>
  <text x="114" y="529" font-size="11.5" fill="#4f6d8b">pass 1: custom_retriever tools, one or more</text>
  <text x="114" y="544" font-size="11.5" fill="#4f6d8b">pass 2: one local / global / unified tool</text>
  <text x="114" y="559" font-size="11.5" fill="#4f6d8b">no match → the steps have nothing to run</text>
  <rect x="358.7" y="496" width="32.3" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="374.84999999999997" y="507.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">LLM</text>
  <rect x="100" y="650" width="300" height="81" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6"/>
  <text x="114" y="672" font-size="13" font-weight="700" fill="#151d25">Write the step query</text>
  <text x="114" y="690" font-size="11.5" fill="#4f6d8b">plan template with {{placeholders}}</text>
  <text x="114" y="705" font-size="11.5" fill="#4f6d8b">+ earlier step results → one concrete query</text>
  <text x="114" y="720" font-size="11.5" fill="#4f6d8b">no placeholders → template used as is</text>
  <rect x="358.7" y="657" width="32.3" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="374.84999999999997" y="668.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">LLM</text>
  <rect x="100" y="771" width="300" height="81" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6"/>
  <text x="114" y="793" font-size="13" font-weight="700" fill="#151d25">Run the matched tool(s)</text>
  <text x="114" y="811" font-size="11.5" fill="#4f6d8b">custom_retriever → 3-stage pipeline</text>
  <text x="114" y="826" font-size="11.5" fill="#4f6d8b">built-in tool → direct retriever call</text>
  <text x="114" y="841" font-size="11.5" fill="#4f6d8b">several matched → run in parallel</text>
  <rect x="100" y="892" width="300" height="81" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6"/>
  <text x="114" y="914" font-size="13" font-weight="700" fill="#151d25">Completion check</text>
  <text x="114" y="932" font-size="11.5" fill="#4f6d8b">answered already → stop early</text>
  <text x="114" y="947" font-size="11.5" fill="#4f6d8b">no results → go on to the next step</text>
  <text x="114" y="962" font-size="11.5" fill="#4f6d8b">config error → stop, return the error</text>
  <rect x="358.7" y="899" width="32.3" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="374.84999999999997" y="910.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">LLM</text>
  <rect x="100" y="1043" width="300" height="81" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6"/>
  <text x="114" y="1065" font-size="13" font-weight="700" fill="#151d25">5. Synthesize</text>
  <text x="114" y="1083" font-size="11.5" fill="#4f6d8b">merge citations across steps (by chunk_id)</text>
  <text x="114" y="1098" font-size="11.5" fill="#4f6d8b">summarize each step result</text>
  <text x="114" y="1113" font-size="11.5" fill="#4f6d8b">final answer prompt → LLM, streamable</text>
  <rect x="358.7" y="1050" width="32.3" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="374.84999999999997" y="1061.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">LLM</text>
  <rect x="100" y="1164" width="300" height="66" rx="22" fill="#044926" stroke="#044926" stroke-width="1.6"/>
  <text x="114" y="1186" font-size="13" font-weight="700" fill="#ffffff">Answer</text>
  <text x="114" y="1204" font-size="11.5" fill="#cfe3d3">metadata: matched_tool_ids, steps executed,</text>
  <text x="114" y="1219" font-size="11.5" fill="#cfe3d3">execution_log, citations, graph_metadata</text>
  <rect x="560" y="368" width="300" height="66" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="574" y="390" font-size="13" font-weight="700" fill="#151d25">Match tools directly</text>
  <text x="574" y="408" font-size="11.5" fill="#4f6d8b">every tool description (custom_tools filter)</text>
  <text x="574" y="423" font-size="11.5" fill="#4f6d8b">no match → “no relevant data” answer</text>
  <rect x="818.7" y="375" width="32.3" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="834.85" y="386.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">LLM</text>
  <rect x="560" y="489" width="300" height="51" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="574" y="511" font-size="13" font-weight="700" fill="#151d25">Run matched tools in parallel</text>
  <text x="574" y="529" font-size="11.5" fill="#4f6d8b">same per-tool execution as the standard run</text>
  <rect x="560" y="650" width="300" height="66" rx="10" fill="#ffffff" stroke="#007339" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="574" y="672" font-size="13" font-weight="700" fill="#151d25">Summarize and synthesize</text>
  <text x="574" y="690" font-size="11.5" fill="#4f6d8b">one summary per tool result</text>
  <text x="574" y="705" font-size="11.5" fill="#4f6d8b">final answer prompt → LLM</text>
  <rect x="818.7" y="657" width="32.3" height="16" rx="8" fill="#b9ff38" stroke="#044926" stroke-width="1"/>
  <text x="834.85" y="668.5" font-size="10" font-weight="700" fill="#044926" text-anchor="middle">LLM</text>
</svg>
