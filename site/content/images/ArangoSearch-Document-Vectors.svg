<svg class="dg-asvec keep-colors" viewBox="0 0 460 420"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;max-width:460px;margin:0 auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .asr .axlbl { font-size: 14px; fill: #314158; }
    .asr .qtext { font-size: 12px; font-weight: bold; fill: #008236; }
    .asr .dtext { font-size: 12px; font-weight: bold; }
    .asr .ang   { font-size: 15px; font-style: italic; }

    /* Dark mode of the docs: role classes (dark.css), except document 3 in indigo: a dark line inside the green query arrow (like the light line in light mode), a light label */
    :root[data-theme="dark"] .dg-asvec .asr path[stroke="#effbfd"] { stroke: #3730a3; }
    :root[data-theme="dark"] .dg-asvec .asr polygon[fill="#effbfd"] { fill: #3730a3; }
    :root[data-theme="dark"] .dg-asvec .asr text[fill="#002e3b"] { fill: #7c86ff; }
  </style>

  <g class="asr">
    <rect width="460" height="420" fill="#f1f5f9" rx="6" class="dg-f-canvas"/>
    <path class="dg-s-raised" d="M 70 354 L 354.0 354.0" stroke="#cad5e2" stroke-width="9" stroke-linecap="round" fill="none"/>
    <polygon points="370.0,354.0 352.0,362.5 352.0,345.5" fill="#cad5e2" class="dg-f-raised"/>
    <path class="dg-s-raised" d="M 70 354 L 70.0 70.0" stroke="#cad5e2" stroke-width="9" stroke-linecap="round" fill="none"/>
    <polygon points="70.0,54.0 78.5,72.0 61.5,72.0" fill="#cad5e2" class="dg-f-raised"/>
    <text x="386" y="359" class="axlbl dg-f-text">brown</text>
    <text x="70" y="40" text-anchor="middle" class="axlbl dg-f-text">quick</text>
    <path d="M 75 349 L 326.7 97.3" stroke="#008236" stroke-width="11" fill="none" stroke-linecap="round" class="dg-s-success"/>
    <polygon points="338.0,86.0 331.3,104.7 319.3,92.7" fill="#008236" class="dg-f-success"/>
    <text x="382" y="58" text-anchor="middle" class="qtext dg-f-success">query:</text>
    <text x="382" y="74" text-anchor="middle" class="qtext dg-f-success">quick or brown</text>
    <path d="M 70 354 L 70.0 185.0" stroke="#00576e" stroke-width="3" stroke-linecap="round" fill="none" class="dg-s-info"/>
    <polygon points="70.0,174.0 75.0,187.0 65.0,187.0" fill="#00576e" class="dg-f-info"/>
    <path d="M 70 354 L 239.0 354.0" stroke="#bb4d00" stroke-width="3" stroke-linecap="round" fill="none" class="dg-s-warning"/>
    <polygon points="250.0,354.0 237.0,359.0 237.0,349.0" fill="#bb4d00" class="dg-f-warning"/>
    <path d="M 69.8 354.2 L 236.2 187.8" stroke="#effbfd" stroke-width="3" stroke-linecap="round" fill="none"/>
    <polygon points="244.0,180.0 238.3,192.7 231.3,185.7" fill="#effbfd"/>
    <text x="128" y="172" text-anchor="middle" class="dtext dg-f-info" fill="#00576e">document 1:</text>
    <text x="128" y="188" text-anchor="middle" class="dtext dg-f-info" fill="#00576e">quick dog</text>
    <text x="246" y="382" text-anchor="middle" class="dtext dg-f-warning" fill="#bb4d00">document 2:</text>
    <text x="246" y="398" text-anchor="middle" class="dtext dg-f-warning" fill="#bb4d00">brown fox</text>
    <text x="290" y="208" text-anchor="middle" class="dtext" fill="#002e3b">document 3:</text>
    <text x="290" y="224" text-anchor="middle" class="dtext" fill="#002e3b">quick brown fox</text>
  </g>
</svg>
