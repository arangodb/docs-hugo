<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 2041" width="936" height="2041" role="img" aria-labelledby="ds-title ds-desc">
  <title id="ds-title">Deep Search architecture</title>
  <desc id="ds-desc">A deep research query flows through four stages: global context retrieval and screening, plan generation from the global context, iterative step execution with local retrieval until a completion check reports the question as solved, and final answer synthesis. If no relevant data is found or no usable plan results, a short message is returned instead.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .ftitle { font-size: 15px; font-weight: 700; fill: #334155; }
    .box { stroke-width: 2; }
    .btitle { font-size: 13.5px; font-weight: 700; }
    .bullet { font-size: 12.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.75; }
    .elabel { font-size: 11px; fill: #475569; }
    .lbg-page { fill: #ffffff; }
    .lbg-frame { fill: #f8fafc; }
  </style>
