    <polygon points="70.0,40.0 78.5,58.0 61.5,58.0" fill="#cad5e2"/>
    <text x="386" y="345" class="axlbl">brown</text>
    <text x="70" y="26" text-anchor="middle" class="axlbl">quick</text>
    <path d="M 70 340 L 326.7 83.3" stroke="#008236" stroke-width="9" stroke-linecap="round" fill="none"/>
    <polygon points="338.0,72.0 331.3,90.7 319.3,78.7" fill="#008236"/>
    <text x="382" y="44" text-anchor="middle" class="qtext">query:</text>
    <text x="382" y="60" text-anchor="middle" class="qtext">quick or brown</text>
