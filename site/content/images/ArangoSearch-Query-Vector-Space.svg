<svg class="keep-colors" viewBox="0 0 460 420"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;max-width:460px;margin:0 auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .asr .axlbl { font-size: 14px; fill: #314158; }
    .asr .qtext { font-size: 12px; font-weight: bold; fill: #008236; }
    .asr .dtext { font-size: 12px; font-weight: bold; }
    .asr .ang   { font-size: 15px; font-style: italic; }
  </style>

  <g class="asr">
    <rect width="460" height="420" fill="#f1f5f9" rx="6" class="dg-f-canvas"/>
    <path class="dg-s-raised" d="M 70 354 L 354.0 354.0" stroke="#cad5e2" stroke-width="9" stroke-linecap="round" fill="none"/>
    <polygon points="370.0,354.0 352.0,362.5 352.0,345.5" fill="#cad5e2" class="dg-f-raised"/>
    <path class="dg-s-raised" d="M 70 354 L 70.0 70.0" stroke="#cad5e2" stroke-width="9" stroke-linecap="round" fill="none"/>
    <polygon points="70.0,54.0 78.5,72.0 61.5,72.0" fill="#cad5e2" class="dg-f-raised"/>
    <text x="386" y="359" class="axlbl dg-f-text">brown</text>
    <text x="70" y="40" text-anchor="middle" class="axlbl dg-f-text">quick</text>
    <path d="M 75 349 L 326.7 97.3" stroke="#008236" stroke-width="11" fill="none" stroke-linecap="round" class="dg-s-success"/>
    <polygon points="338.0,86.0 331.3,104.7 319.3,92.7" fill="#008236" class="dg-f-success"/>
    <text x="382" y="58" text-anchor="middle" class="qtext dg-f-success">query:</text>
    <text x="382" y="74" text-anchor="middle" class="qtext dg-f-success">quick or brown</text>
  </g>
