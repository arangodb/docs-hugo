<svg viewBox="0 0 460 420"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;max-width:460px;margin:0 auto">
  <style>
    .asr .axlbl { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #314158; }
    .asr .qtext { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #008236; }
    .asr .dtext { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; }
    .asr .ang   { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-style: italic; }
  </style>

  <g class="asr">
    <rect width="460" height="420" fill="#f1f5f9" rx="6"/>
    <path d="M 70 354 L 354.0 354.0" stroke="#cad5e2" stroke-width="9" stroke-linecap="round" fill="none"/>
    <polygon points="370.0,354.0 352.0,362.5 352.0,345.5" fill="#cad5e2"/>
