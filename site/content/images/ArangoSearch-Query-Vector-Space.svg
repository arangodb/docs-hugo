    <text x="386" y="359" class="axlbl">brown</text>
    <text x="70" y="40" text-anchor="middle" class="axlbl">quick</text>
    <path d="M 75 349 L 326.7 97.3" stroke="#008236" stroke-width="11" fill="none" stroke-linecap="round"/>
    <polygon points="338.0,86.0 331.3,104.7 319.3,92.7" fill="#008236"/>
    <text x="382" y="58" text-anchor="middle" class="qtext">query:</text>
