  <text class="bullet" x="672" y="550.0">nodes</text>
  <text class="bullet" x="662" y="569.0">•</text>
  <text class="bullet" x="672" y="569.0">Used as starting points</text>
  <text class="bullet" x="672" y="585.0">in graph</text>
