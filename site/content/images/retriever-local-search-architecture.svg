<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1837" width="900" height="1837" role="img" aria-labelledby="ls-title ls-desc">
  <title id="ls-title">Local Search architecture</title>
  <desc id="ls-desc">A local query flows through three stages: entity retrieval with hybrid lexical and semantic search and a semantic-only fallback, graph expansion around the anchor entities, and local graph context assembly.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .ftitle { font-size: 15px; font-weight: 700; fill: #334155; }
    .box { stroke-width: 2; }
    .btitle { font-size: 13.5px; font-weight: 700; }
    .bullet { font-size: 12.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.75; }
    .elabel { font-size: 11px; fill: #475569; }
    .lbg-page { fill: #ffffff; }
    .lbg-frame { fill: #f8fafc; }
  </style>
  <defs>
