  <text class="btitle" x="359" y="345.0">entities</text>
  <text class="bullet" x="359" y="368.0">•</text>
  <text class="bullet" x="369" y="368.0">Compare query vector</text>
  <text class="bullet" x="369" y="384.0">with entity vectors</text>
  <text class="bullet" x="359" y="403.0">•</text>
  <text class="bullet" x="369" y="403.0">Rank by similarity</text>
