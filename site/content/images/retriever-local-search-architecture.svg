  <text class="bullet" x="662" y="281.0">•</text>
  <text class="bullet" x="672" y="281.0">Merge lists</text>
  <text class="bullet" x="662" y="300.0">•</text>
  <text class="bullet" x="672" y="300.0">Compute fused rank</text>
  <text class="bullet" x="662" y="319.0">•</text>
  <text class="bullet" x="672" y="319.0">Keep top-K entities as</text>
  <text class="bullet" x="672" y="335.0">anchors</text>
  <rect class="box" x="44" y="484.0" width="206" height="118.0" rx="8" fill="#f3e8ff" stroke="#7e22ce"/>
  <text class="btitle" x="56" y="511.0">Hybrid result check</text>
  <text class="bullet" x="56" y="534.0">•</text>
  <text class="bullet" x="66" y="534.0">If anchors found →</text>
  <text class="bullet" x="66" y="550.0">continue</text>
  <text class="bullet" x="56" y="569.0">•</text>
  <text class="bullet" x="66" y="569.0">If none or error →</text>
  <text class="bullet" x="66" y="585.0">use fallback</text>
