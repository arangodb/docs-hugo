  <text class="bullet" x="359" y="248.0">•</text>
  <text class="bullet" x="369" y="248.0">Rank by text relevance</text>
  <rect class="box" x="347" y="301.0" width="206" height="119.0" rx="8" fill="#dcfce7" stroke="#15803d"/>
