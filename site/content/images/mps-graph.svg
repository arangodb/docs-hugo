<svg xmlns="http://www.w3.org/2000/svg" class="keep-colors" viewBox="-3 -8 506 276" width="506" height="276" role="img" aria-labelledby="mps-graph-t mps-graph-d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="mps-graph-t">The mps_graph example graph</title>
  <desc id="mps-graph-d">Six nodes A to F in the mps_verts collection with edges in the mps_edges collection: A points to B, D, and E. B and D point to C. E points to F, and F points to C. There are three paths from A to C: via B, via D, and via E and F.</desc>
