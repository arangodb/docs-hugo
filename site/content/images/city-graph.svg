  <title id="city-graph-t">The routeplanner example graph</title>
  <desc id="city-graph-d">German cities (Berlin, Cologne, Hamburg) in the germanCity collection and French cities (Lyon, Paris) in the frenchCity collection, connected by highways with a distance: germanHighway edges from Berlin to Cologne (850) and Hamburg (400) and from Hamburg to Cologne (500), a frenchHighway edge from Paris to Lyon (550), and internationalHighway edges from Berlin to Lyon (1100) and Paris (1200), from Hamburg to Paris (900) and Lyon (1300), and from Cologne to Lyon (700) and Paris (550).</desc>
