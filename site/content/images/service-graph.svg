  <title id="service-graph-t">Service dependency graph</title>
  <desc id="service-graph-d">The serviceGraph example graph: services as nodes and calls between them as edges, labeled with the protocol and latency. web calls api. api calls auth, catalog, and orders. auth and catalog call db, catalog also calls cache. orders calls inventory and payments, inventory calls db, payments calls the external bank and calls orders back, which forms a cycle.</desc>
