<svg viewBox="0 0 820 236" width="820" height="236"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    .igul text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .igul .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .igul .ptitle { font-size: 13px; font-weight: 600; fill: #1d293d; }
    .igul .edge { stroke: #90a1b9; stroke-width: 1.2; }
    .igul .edge-new { stroke: #008236; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .igul .edge-gone { stroke: #cad5e2; stroke-width: 1; stroke-dasharray: 2 3; }
    .igul .node { fill: #e3eef0; stroke: #00576e; stroke-width: 1.5; }
    .igul .node-new { fill: #befe99; stroke: #008236; stroke-width: 1.5; }
    .igul .node-del { fill: #fef9c2; stroke: #bb4d00; stroke-width: 1.5; }
    .igul .node-gone { fill: #ffffff; stroke: #90a1b9; stroke-width: 1.2; stroke-dasharray: 2 2; }
    .igul .ring { fill: none; stroke: #008236; stroke-width: 1.5; stroke-dasharray: 3 2; }
    .igul .comm { fill: #eefbd5; stroke: #008236; stroke-width: 1.5; }
    .igul .comm-stale { fill: #f1f5f9; stroke: #90a1b9; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .igul .legend { font-size: 12px; fill: #314158; }
  </style>
  <g class="igul">
    <rect width="820" height="236" fill="#f1f5f9" rx="6"/>
    <rect class="panel" x="20" y="20" width="780" height="92" rx="8"/>
    <text class="ptitle" x="36" y="42" text-anchor="start">Corpus graph: documents and how similar they are</text>
    <circle class="node" cx="44" cy="70" r="7"/>
    <text class="legend" x="58" y="74" text-anchor="start">existing document</text>
    <circle class="node-new" cx="204" cy="70" r="7"/>
    <text class="legend" x="218" y="74" text-anchor="start">added document or new version</text>
    <circle class="node-del" cx="438" cy="70" r="7"/>
    <text class="legend" x="452" y="74" text-anchor="start">document to remove</text>
    <circle class="node" cx="604" cy="70" r="7"/>
    <circle class="ring" cx="604" cy="70" r="12"/>
    <text class="legend" x="623" y="74" text-anchor="start">document to replace</text>
    <circle class="node-gone" cx="44" cy="96" r="7"/>
    <text class="legend" x="58" y="100" text-anchor="start">removed document</text>
    <line class="edge" x1="193" y1="96" x2="215" y2="96"/>
    <text class="legend" x="223" y="100" text-anchor="start">similarity edge</text>
    <line class="edge-new" x1="341" y1="96" x2="363" y2="96"/>
    <text class="legend" x="371" y="100" text-anchor="start">new or recalculated similarity edge</text>
    <line class="edge-gone" x1="593" y1="96" x2="615" y2="96"/>
    <text class="legend" x="623" y="100" text-anchor="start">removed similarity edge</text>
    <rect class="panel" x="20" y="124" width="780" height="92" rx="8"/>
    <text class="ptitle" x="36" y="146" text-anchor="start">Knowledge graph: what the documents are about</text>
    <circle class="node" cx="44" cy="174" r="7"/>
    <text class="legend" x="58" y="178" text-anchor="start">entity</text>
    <circle class="node-new" cx="204" cy="174" r="7"/>
    <text class="legend" x="218" y="178" text-anchor="start">added entity</text>
    <circle class="node-gone" cx="438" cy="174" r="7"/>
    <text class="legend" x="452" y="178" text-anchor="start">removed entity</text>
    <line class="edge" x1="593" y1="174" x2="615" y2="174"/>
    <text class="legend" x="623" y="178" text-anchor="start">relationship</text>
    <ellipse class="comm" cx="44" cy="200" rx="16" ry="10"/>
    <text class="legend" x="68" y="204" text-anchor="start">community</text>
    <ellipse class="comm-stale" cx="204" cy="200" rx="16" ry="10"/>
    <text class="legend" x="228" y="204" text-anchor="start">out-of-date community</text>
  </g>
</svg>
