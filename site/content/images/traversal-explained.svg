<svg xmlns="http://www.w3.org/2000/svg" class="keep-colors" viewBox="-8 -6 716 402" width="716" height="402" role="img" aria-labelledby="traversal-explained-t traversal-explained-d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="traversal-explained-t">Traversal tree of a traversal from api with depth 2..3</title>
  <desc id="traversal-explained-d">The paths that the traversal FOR v, e, p IN 2..3 OUTBOUND services/api GRAPH serviceGraph follows, arranged by depth. Depth 0 is the start node api. At depth 1, the traversal visits auth, catalog, and orders but doesn't emit them because the minimum depth is 2. At depth 2, it emits db via auth, db and cache via catalog, and inventory and payments via orders. At depth 3, it emits db via inventory, as well as bank and orders via payments. orders is reached again through the cycle between orders and payments. The traversal doesn't follow the edges of depth 3 nodes because the maximum depth is 3.</desc>
