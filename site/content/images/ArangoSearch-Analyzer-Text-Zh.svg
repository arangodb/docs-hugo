<svg viewBox="0 0 600 178"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;max-width:600px;margin:0 auto">
  <style>
    .asa .inp   { fill: #ffffff; stroke: #86efac; stroke-width: 1.5; }
    .asa .an    { fill: #b9f5a0; stroke: #4ade80; stroke-width: 1.5; }
    .asa .chip  { fill: #ecfccb; stroke: #86efac; stroke-width: 1; }
    .asa .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #14532d; }
    .asa .anl   { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #0b2e1e; }
    .asa .cap   { font-family: sans-serif; font-size: 10px; font-style: italic; fill: #14532d; }
  </style>
  <g class="asa">
    <rect width="600" height="178" fill="#f3f4f6" rx="6"/>

    <rect x="180" y="14" width="240" height="42" rx="10" class="inp"/>
    <text x="300" y="40" text-anchor="middle" class="mono">"ArangoDB是一个多模型数据库"</text>
    <text x="174" y="40" text-anchor="end" class="cap">attribute value</text>

    <path d="M 300 56 L 300 68" stroke="#4ade80" stroke-width="2" fill="none"/>
    <rect x="230" y="68" width="140" height="28" rx="14" class="an"/>
    <text x="300" y="87" text-anchor="middle" class="anl">text_zh Analyzer</text>
    <path d="M 300 96 L 300 105" stroke="#4ade80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="300,114 295.5,103 304.5,103" fill="#4ade80"/>
    <rect x="113" y="122" width="78" height="36" rx="8" class="chip"/>
    <text x="152" y="145" text-anchor="middle" class="mono">arangodb</text>
    <rect x="201" y="122" width="33" height="36" rx="8" class="chip"/>
    <text x="217" y="145" text-anchor="middle" class="mono">是</text>
    <rect x="244" y="122" width="46" height="36" rx="8" class="chip"/>
    <text x="267" y="145" text-anchor="middle" class="mono">一个</text>
    <rect x="300" y="122" width="33" height="36" rx="8" class="chip"/>
    <text x="316" y="145" text-anchor="middle" class="mono">多</text>
    <rect x="343" y="122" width="46" height="36" rx="8" class="chip"/>
    <text x="366" y="145" text-anchor="middle" class="mono">模型</text>
    <rect x="399" y="122" width="46" height="36" rx="8" class="chip"/>
    <text x="422" y="145" text-anchor="middle" class="mono">数据</text>
    <rect x="455" y="122" width="33" height="36" rx="8" class="chip"/>
    <text x="471" y="145" text-anchor="middle" class="mono">库</text>
    <text x="107" y="145" text-anchor="end" class="cap">tokens</text>
  </g>
</svg>
