<svg class="keep-colors" viewBox="0 0 600 178"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;max-width:600px;margin:0 auto">
  <style>
    .asa .inp   { fill: #ffffff; stroke: #90a1b9; stroke-width: 1.5; }
    .asa .an    { fill: #befe99; stroke: #00576e; stroke-width: 1.5; }
    .asa .chip  { fill: #eefbd5; stroke: #90a1b9; stroke-width: 1; }
    .asa .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #014654; }
    .asa .anl   { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #014654; }
    .asa .cap   { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-style: italic; fill: #014654; }
  </style>
  <g class="asa">
    <rect width="600" height="178" fill="#f1f5f9" rx="6" class="dg-f-canvas"/>

    <rect x="180" y="14" width="240" height="42" rx="10" class="inp dg-f-node dg-s-line"/>
    <text x="300" y="40" text-anchor="middle" class="mono dg-f-text">"ArangoDB是一个多模型数据库"</text>
    <text x="174" y="40" text-anchor="end" class="cap dg-f-text">attribute value</text>

    <path d="M 300 56 L 300 68" stroke="#00576e" stroke-width="2" fill="none" class="dg-s-accent"/>
    <rect x="230" y="68" width="140" height="28" rx="14" class="an"/>
    <text x="300" y="87" text-anchor="middle" class="anl">text_zh Analyzer</text>
    <path d="M 300 96 L 300 105" stroke="#00576e" stroke-width="2" stroke-linecap="round" fill="none" class="dg-s-accent"/>
    <polygon points="300,114 295.5,103 304.5,103" fill="#00576e" class="dg-f-accent"/>
    <rect x="113" y="122" width="78" height="36" rx="8" class="chip dg-f-tag dg-s-line"/>
    <text x="152" y="145" text-anchor="middle" class="mono dg-f-lime">arangodb</text>
    <rect x="201" y="122" width="33" height="36" rx="8" class="chip dg-f-tag dg-s-line"/>
    <text x="217" y="145" text-anchor="middle" class="mono dg-f-lime">是</text>
    <rect x="244" y="122" width="46" height="36" rx="8" class="chip dg-f-tag dg-s-line"/>
    <text x="267" y="145" text-anchor="middle" class="mono dg-f-lime">一个</text>
    <rect x="300" y="122" width="33" height="36" rx="8" class="chip dg-f-tag dg-s-line"/>
    <text x="316" y="145" text-anchor="middle" class="mono dg-f-lime">多</text>
    <rect x="343" y="122" width="46" height="36" rx="8" class="chip dg-f-tag dg-s-line"/>
    <text x="366" y="145" text-anchor="middle" class="mono dg-f-lime">模型</text>
    <rect x="399" y="122" width="46" height="36" rx="8" class="chip dg-f-tag dg-s-line"/>
    <text x="422" y="145" text-anchor="middle" class="mono dg-f-lime">数据</text>
    <rect x="455" y="122" width="33" height="36" rx="8" class="chip dg-f-tag dg-s-line"/>
    <text x="471" y="145" text-anchor="middle" class="mono dg-f-lime">库</text>
    <text x="107" y="145" text-anchor="end" class="cap dg-f-text">tokens</text>
  </g>
</svg>
