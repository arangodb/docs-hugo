  <title id="traversal-graph-t">The traversalGraph example graph</title>
  <desc id="traversal-graph-d">Eleven circles nodes A to K connected by edges with labels. A points to B (left_bar) and G (right_foo). B points to C (left_blarg) and E (left_blub). C points to D (left_blorg), E points to F (left_schubi). G points to H (right_blob) and J (right_zip). H points to I (right_blub), J points to K (right_zup).</desc>
