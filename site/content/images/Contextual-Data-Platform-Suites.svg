<svg viewBox="0 0 900 800"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     style="display:block;width:100%;max-width:900px;margin:0 auto">
  <style>
    .cdp-suites .card-link { cursor: pointer; }
    .cdp-suites .card-link .pill-aai { fill: #b9f5a0; stroke: #4ade80; stroke-width: 1.5; }
    .cdp-suites .card-link .pill-ps  { fill: #ffffff; stroke: #86efac; stroke-width: 1.5; }
    .cdp-suites .card-link .pill-db  { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.5; }
    .cdp-suites .card-link:hover .pill-aai { fill: #ffffff; stroke: #22c55e; }
    .cdp-suites .card-link:hover .pill-ps  { fill: #dcfce7; stroke: #22c55e; }
    .cdp-suites .card-link:hover .pill-db  { fill: #b9ff38; stroke: #22c55e; }
  </style>
  <defs>
    <filter id="cdp-suites-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g class="cdp-suites">
    <rect width="900" height="800" fill="#f3f4f6" rx="6"/>

    <!-- Title and the one-sentence message -->
    <text x="20" y="40" font-family="sans-serif" font-size="21" font-weight="bold" fill="#111827">Arango Contextual Data Platform</text>
    <text x="20" y="62" font-family="sans-serif" font-size="13" fill="#374151">Three layers. ArangoDB and the Platform Suite are always included.</text>
    <text x="20" y="80" font-family="sans-serif" font-size="13" fill="#374151">The Agentic AI Suite is optional: it runs on top of them and cannot be licensed stand-alone.</text>

    <!-- Layer 3: Agentic AI Suite (optional, separate license) -->
    <rect x="20" y="100" width="620" height="245" rx="14" fill="#0b2e1e" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 5" filter="url(#cdp-suites-glow)"/>
    <rect x="20" y="100" width="620" height="40" rx="14" fill="#134d2e"/>
    <rect x="20" y="120" width="620" height="20" fill="#134d2e"/>
    <text x="40" y="126" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Agentic AI Suite</text>
    <text x="620" y="126" text-anchor="end" font-family="sans-serif" font-size="12" fill="#b9ff38">optional · separate license</text>
    <a class="card-link" xlink:href="/contextual-data-platform/autograph-studio/">
      <rect x="45" y="155" width="285" height="36" rx="18" class="pill-aai"/>
      <text x="187" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">AutoGraph Studio</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/graphml/">
      <rect x="345" y="155" width="285" height="36" rx="18" class="pill-aai"/>
      <text x="487" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">GraphML</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/graph-analytics/">
      <rect x="45" y="201" width="285" height="36" rx="18" class="pill-aai"/>
      <text x="187" y="223" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Graph Analytics</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/natural-language-to-aql/">
      <rect x="345" y="201" width="285" height="36" rx="18" class="pill-aai"/>
      <text x="487" y="223" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Natural Language to AQL</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/reasoner/">
      <rect x="45" y="247" width="285" height="36" rx="18" class="pill-aai"/>
      <text x="187" y="269" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Reasoner</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/ada/">
      <rect x="345" y="247" width="285" height="36" rx="18" class="pill-aai"/>
      <text x="487" y="269" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Ada</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/notebook-servers/">
      <rect x="45" y="293" width="285" height="36" rx="18" class="pill-aai"/>
      <text x="187" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Notebook servers</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/private-llms/">
      <rect x="345" y="293" width="285" height="36" rx="18" class="pill-aai"/>
      <text x="487" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Private LLM hosting</text>
    </a>

    <!-- Plugs: the Agentic AI Suite runs on top of the Platform Suite -->
    <rect x="300" y="345" width="10" height="18" fill="#4ade80"/>
    <rect x="330" y="345" width="10" height="18" fill="#4ade80"/>
    <rect x="360" y="345" width="10" height="18" fill="#4ade80"/>

    <!-- Layer 2: Platform Suite (always included) -->
    <rect x="20" y="363" width="620" height="291" rx="14" fill="#0b2e1e" stroke="#22c55e" stroke-width="2" filter="url(#cdp-suites-glow)"/>
    <rect x="20" y="363" width="620" height="40" rx="14" fill="#134d2e"/>
    <rect x="20" y="383" width="620" height="20" fill="#134d2e"/>
    <text x="40" y="389" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Platform Suite</text>
    <text x="620" y="389" text-anchor="end" font-family="sans-serif" font-size="12" fill="#b9ff38">always included</text>
    <a class="card-link" xlink:href="/contextual-data-platform/graph-visualizer/">
      <rect x="45" y="418" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="187" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Graph Visualizer</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/query-editor/">
      <rect x="345" y="418" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="487" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Query Editor</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/container-manager/">
      <rect x="45" y="464" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="187" y="486" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Container Manager (BYOC)</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/file-manager/">
      <rect x="345" y="464" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="487" y="486" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">File Manager</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/secrets-manager/">
      <rect x="45" y="510" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="187" y="532" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Secrets Manager</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/cypher-to-aql/">
      <rect x="345" y="510" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="487" y="532" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Cypher to AQL</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/control-plane-acp/">
      <rect x="45" y="556" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="187" y="578" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Arango Control Plane</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/monitoring/">
      <rect x="345" y="556" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="487" y="578" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Monitoring</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/access-control/">
      <rect x="45" y="602" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="187" y="624" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Access control (SSO, RBAC)</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/architecture/#operational-model">
      <rect x="345" y="602" width="285" height="36" rx="18" class="pill-ps"/>
      <text x="487" y="624" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">High availability, elastic scaling</text>
    </a>

    <!-- Layer 1: ArangoDB, the core database (always included) -->
    <rect x="20" y="664" width="620" height="107" rx="14" fill="#0b2e1e" stroke="#22c55e" stroke-width="2" filter="url(#cdp-suites-glow)"/>
    <rect x="20" y="664" width="620" height="40" rx="14" fill="#134d2e"/>
    <rect x="20" y="684" width="620" height="20" fill="#134d2e"/>
    <text x="40" y="690" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">ArangoDB Enterprise Edition</text>
    <text x="620" y="690" text-anchor="end" font-family="sans-serif" font-size="12" fill="#b9ff38">core database · always included</text>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="45" y="719" width="106" height="36" rx="18" class="pill-db"/>
      <text x="98" y="741" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Graph</text>
    </a>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="161" y="719" width="106" height="36" rx="18" class="pill-db"/>
      <text x="214" y="741" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Document</text>
    </a>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="277" y="719" width="106" height="36" rx="18" class="pill-db"/>
      <text x="330" y="741" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Key-Value</text>
    </a>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="393" y="719" width="106" height="36" rx="18" class="pill-db"/>
      <text x="446" y="741" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Search</text>
    </a>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="509" y="719" width="106" height="36" rx="18" class="pill-db"/>
      <text x="562" y="741" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b2e1e">Vector</text>
    </a>

    <!-- License brackets -->
    <path d="M 665 100 h 10 v 245 h -10" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="687" y="190" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">+ Agentic AI Suite license</text>
    <text x="687" y="208" font-family="sans-serif" font-size="11" fill="#374151">separate license,</text>
    <text x="687" y="224" font-family="sans-serif" font-size="11" fill="#374151">requires the Platform</text>
    <text x="687" y="240" font-family="sans-serif" font-size="11" fill="#374151">Suite license</text>
    <path d="M 665 363 h 10 v 408 h -10" fill="none" stroke="#14532d" stroke-width="2"/>
    <text x="687" y="543" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">Platform Suite license</text>
    <text x="687" y="561" font-family="sans-serif" font-size="11" fill="#374151">ArangoDB and the Platform Suite,</text>
    <text x="687" y="577" font-family="sans-serif" font-size="11" fill="#374151">always included</text>
  </g>
</svg>
