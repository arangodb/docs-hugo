<svg viewBox="0 0 900 906"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     style="display:block;width:100%;max-width:900px;margin:0 auto">
  <style>
    .cdp-suites text { font-family: Inter, sans-serif; }
    .cdp-suites .card-link { cursor: pointer; }
    .cdp-suites .card-link rect { stroke-width: 1.5; }
    .cdp-suites .card-link .pill-aai { fill: url(#cdp-suites-aai-fill); stroke: #b9ff38; }
    .cdp-suites .card-link .pill-ps  { fill: #b9f5a0; stroke: #4ade80; }
    .cdp-suites .card-link .pill-db  { fill: #d3e6da; stroke: #8fbfa3; }
    .cdp-suites .card-link:hover rect { fill: #ffffff; stroke: #22c55e; }
    .cdp-suites .card-link text { font-size: 16px; font-weight: 600; fill: #0b2e1e; }
  </style>
  <defs>
    <filter id="cdp-suites-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cdp-suites-aai-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ff70"/>
      <stop offset="1" stop-color="#8ef0b4"/>
    </linearGradient>
  </defs>

  <g class="cdp-suites">
    <rect width="900" height="906" fill="#f3f4f6" rx="6"/>

    <!-- Title and the one-sentence message -->
    <text x="20" y="42" font-size="24" font-weight="bold" fill="#111827">Arango Contextual Data Platform</text>
    <text x="20" y="70" font-size="17" fill="#374151">Three layers. ArangoDB and the Platform Suite are always included.</text>
    <text x="20" y="94" font-size="17" fill="#374151">The Agentic AI Suite is an optional add-on to them and cannot be licensed stand-alone.</text>

    <!-- Layer 3: Agentic AI Suite (optional, separate license) -->
    <rect x="20" y="116" width="594" height="266" rx="14" fill="#0b2e1e"/>
    <path d="M 20 160 V 130 A 14 14 0 0 1 34 116 H 600 A 14 14 0 0 1 614 130 V 160 Z" fill="#134d2e"/>
    <rect x="21" y="117" width="592" height="264" rx="13" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 5" filter="url(#cdp-suites-glow)"/>
    <text x="40" y="145" font-size="18" font-weight="bold" fill="#ffffff">Agentic AI Suite</text>
    <text x="594" y="145" text-anchor="end" font-size="15" fill="#b9ff38">optional · separate license</text>
    <a class="card-link" xlink:href="/contextual-data-platform/autograph/">
      <rect x="42" y="176" width="270" height="40" rx="20" class="pill-aai"/>
      <text x="177" y="202" text-anchor="middle">AutoGraph Studio</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/graphml/">
      <rect x="322" y="176" width="270" height="40" rx="20" class="pill-aai"/>
      <text x="457" y="202" text-anchor="middle">GraphML</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/graph-analytics/">
      <rect x="42" y="226" width="270" height="40" rx="20" class="pill-aai"/>
      <text x="177" y="252" text-anchor="middle">Graph Analytics</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/natural-language-to-aql/">
      <rect x="322" y="226" width="270" height="40" rx="20" class="pill-aai"/>
      <text x="457" y="252" text-anchor="middle">Natural Language to AQL</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/reasoner/">
      <rect x="42" y="276" width="270" height="40" rx="20" class="pill-aai"/>
      <text x="177" y="302" text-anchor="middle">Reasoner</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/ada/">
      <rect x="322" y="276" width="270" height="40" rx="20" class="pill-aai"/>
      <text x="457" y="302" text-anchor="middle">Ada</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/notebook-servers/">
      <rect x="42" y="326" width="270" height="40" rx="20" class="pill-aai"/>
      <text x="177" y="352" text-anchor="middle">Notebook servers</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/private-llms/">
      <rect x="322" y="326" width="270" height="40" rx="20" class="pill-aai"/>
      <text x="457" y="352" text-anchor="middle">Private LLM hosting</text>
    </a>

    <!-- Plus: the Agentic AI Suite adds to the layers below -->
    <path d="M 317 392 V 408 M 309 400 H 325" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Layer 2: Platform Suite (always included) -->
    <rect x="20" y="418" width="594" height="316" rx="14" fill="#0b2e1e"/>
    <path d="M 20 462 V 432 A 14 14 0 0 1 34 418 H 600 A 14 14 0 0 1 614 432 V 462 Z" fill="#134d2e"/>
    <rect x="21" y="419" width="592" height="314" rx="13" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#cdp-suites-glow)"/>
    <text x="40" y="447" font-size="18" font-weight="bold" fill="#ffffff">Platform Suite</text>
    <text x="594" y="447" text-anchor="end" font-size="15" fill="#b9ff38">always included</text>
    <a class="card-link" xlink:href="/contextual-data-platform/graph-visualizer/">
      <rect x="42" y="478" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="177" y="504" text-anchor="middle">Graph Visualizer</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/query-editor/">
      <rect x="322" y="478" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="457" y="504" text-anchor="middle">Query Editor</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/container-manager/">
      <rect x="42" y="528" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="177" y="554" text-anchor="middle">Container Manager (BYOC)</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/file-manager/">
      <rect x="322" y="528" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="457" y="554" text-anchor="middle">File Manager</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/secrets-manager/">
      <rect x="42" y="578" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="177" y="604" text-anchor="middle">Secrets Manager</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/cypher-to-aql/">
      <rect x="322" y="578" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="457" y="604" text-anchor="middle">Cypher to AQL</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/control-plane-acp/">
      <rect x="42" y="628" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="177" y="654" text-anchor="middle">Arango Control Plane</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/monitoring/">
      <rect x="322" y="628" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="457" y="654" text-anchor="middle">Monitoring</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/access-control/">
      <rect x="42" y="678" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="177" y="704" text-anchor="middle">Access control (SSO, RBAC)</text>
    </a>
    <a class="card-link" xlink:href="/contextual-data-platform/architecture/#operational-model">
      <rect x="322" y="678" width="270" height="40" rx="20" class="pill-ps"/>
      <text x="457" y="704" text-anchor="middle">High availability, elastic scaling</text>
    </a>

    <!-- Plus: the Platform Suite and ArangoDB work together -->
    <path d="M 317 744 V 760 M 309 752 H 325" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Layer 1: ArangoDB, the core database (always included) -->
    <rect x="20" y="770" width="594" height="116" rx="14" fill="#0b2e1e"/>
    <path d="M 20 814 V 784 A 14 14 0 0 1 34 770 H 600 A 14 14 0 0 1 614 784 V 814 Z" fill="#134d2e"/>
    <rect x="21" y="771" width="592" height="114" rx="13" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#cdp-suites-glow)"/>
    <text x="40" y="799" font-size="18" font-weight="bold" fill="#ffffff">ArangoDB Enterprise Edition</text>
    <text x="594" y="799" text-anchor="end" font-size="15" fill="#b9ff38">core database · always included</text>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="42" y="830" width="102" height="40" rx="20" class="pill-db"/>
      <text x="93" y="856" text-anchor="middle">Graph</text>
    </a>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="154" y="830" width="102" height="40" rx="20" class="pill-db"/>
      <text x="205" y="856" text-anchor="middle">Document</text>
    </a>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="266" y="830" width="102" height="40" rx="20" class="pill-db"/>
      <text x="317" y="856" text-anchor="middle">Key-Value</text>
    </a>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="378" y="830" width="102" height="40" rx="20" class="pill-db"/>
      <text x="429" y="856" text-anchor="middle">Search</text>
    </a>
    <a class="card-link" xlink:href="/arangodb/">
      <rect x="490" y="830" width="102" height="40" rx="20" class="pill-db"/>
      <text x="541" y="856" text-anchor="middle">Vector</text>
    </a>

    <!-- License brackets -->
    <path d="M 630 116 h 10 v 266 h -10" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="650" y="221" font-size="18" font-weight="bold" fill="#15803d">+ Agentic AI Suite license</text>
    <text x="650" y="245" font-size="17" fill="#374151">Separate license,</text>
    <text x="650" y="267" font-size="17" fill="#374151">requires the</text>
    <text x="650" y="289" font-size="17" fill="#374151">Platform Suite license</text>
    <path d="M 630 418 h 10 v 468 h -10" fill="none" stroke="#14532d" stroke-width="2"/>
    <text x="650" y="624" font-size="18" font-weight="bold" fill="#14532d">Platform Suite license</text>
    <text x="650" y="648" font-size="17" fill="#374151">Covers ArangoDB and</text>
    <text x="650" y="670" font-size="17" fill="#374151">the Platform Suite,</text>
    <text x="650" y="692" font-size="17" fill="#374151">always included</text>
  </g>
</svg>
