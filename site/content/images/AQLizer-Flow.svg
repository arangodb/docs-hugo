<svg viewBox="0 0 1300 360" width="1300" height="360"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    .aql .pill-aai { fill: #befe99; stroke: #00576e; stroke-width: 1.5; }
    .aql .pill-ps  { fill: #ffffff; stroke: #90a1b9; stroke-width: 1.5; }
    .aql .cyl-db   { fill: #014654; stroke: #00576e; stroke-width: 2; }
    .aql .cyl-db-top { fill: #00576e; stroke: #00576e; stroke-width: 2; }
    .aql .cyl-llm  { fill: #e2e8f0; stroke: #90a1b9; stroke-width: 1.5; }
    .aql .cyl-llm-top { fill: #f1f5f9; stroke: #90a1b9; stroke-width: 1.5; }
    .aql .card:hover .pill-aai     { fill: #ffffff; stroke: #00576e; }
    .aql .card:hover .pill-ps      { fill: #eefbd5; stroke: #00576e; }
    .aql .card:hover .cyl-db       { fill: #00576e; stroke: #befe99; }
    .aql .card:hover .cyl-db-top   { fill: #06838a; stroke: #befe99; }
    .aql .card:hover .cyl-llm      { fill: #befe99; stroke: #00576e; }
    .aql .card:hover .cyl-llm-top  { fill: #eefbd5; stroke: #00576e; }
  </style>
  <defs>
    <filter id="aql-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aql-arrow" markerWidth="10" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0,10 4,0 8" fill="#00576e"/>
    </marker>
  </defs>

  <g class="aql">
    <rect width="1300" height="360" fill="#f1f5f9" rx="6"/>

    <g class="card">
      <rect x="20" y="190" width="160" height="100" rx="14" class="pill-ps"/>
      <text x="100" y="230" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">User</text>
      <text x="100" y="255" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">asks in plain English</text>
    </g>

    <g class="card">
      <rect x="260" y="190" width="180" height="100" rx="14" class="pill-aai" filter="url(#aql-glow)"/>
      <text x="350" y="230" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">Query Editor</text>
      <text x="350" y="255" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">or REST API</text>
    </g>

    <g class="card">
      <rect x="520" y="190" width="180" height="100" rx="14" class="pill-aai" filter="url(#aql-glow)"/>
      <text x="610" y="230" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">AI Translator</text>
      <text x="610" y="255" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">question to AQL</text>
    </g>

    <g class="card">
      <rect x="790" y="70" width="180" height="100" rx="14" class="pill-aai" filter="url(#aql-glow)"/>
      <text x="880" y="110" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#014654">AQL Executor</text>
      <text x="880" y="135" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#014654">runs the query</text>
    </g>

    <g class="card">
      <path d="M 1070 86 L 1070 158 A 70 14 0 0 0 1210 158 L 1210 86" class="cyl-db"/>
      <ellipse cx="1140" cy="86" rx="70" ry="14" class="cyl-db-top"/>
      <text x="1140" y="130" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">ArangoDB</text>
      <text x="1140" y="150" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#befe99">your data</text>
    </g>

    <g class="card">
      <path d="M 810 206 L 810 270 A 70 14 0 0 0 950 270 L 950 206" class="cyl-llm"/>
      <ellipse cx="880" cy="206" rx="70" ry="14" class="cyl-llm-top"/>
      <text x="880" y="257" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d293d">LLM provider</text>
    </g>

    <path d="M 180 240 L 252.2 240" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aql-arrow)"/>
    <rect x="182" y="218" width="76" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="220" y="230" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">plain question</text>

    <path d="M 440 240 L 512.2 240" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aql-arrow)"/>

    <path d="M 680 190 L 680 120 L 782.2 120" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aql-arrow)"/>

    <path d="M 700 230 L 802.2 230" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aql-arrow)"/>
    <rect x="725" y="214" width="48" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="749" y="226" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">prompt</text>

    <path d="M 810 258 L 707.8 258" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aql-arrow)"/>
    <rect x="720" y="264" width="78" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="759" y="276" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">generated AQL</text>

    <path d="M 970 120 L 1062 120" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aql-arrow)"/>

    <path d="M 820 70 L 820 40 L 100 40 L 100 182.2" stroke="#00576e" stroke-width="2" fill="none" marker-end="url(#aql-arrow)"/>
    <rect x="395" y="32" width="130" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="460" y="44" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">answer in plain English</text>

    <path d="M 1140 172 L 1140 330 L 610 330 L 610 297.8" stroke="#00576e" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#aql-arrow)"/>
    <rect x="855" y="322" width="50" height="16" rx="4" fill="#eefbd5" stroke="#90a1b9" stroke-width="0.5"/>
    <text x="880" y="334" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#014654">schema</text>
  </g>
</svg>
