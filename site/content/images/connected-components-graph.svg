<svg xmlns="http://www.w3.org/2000/svg" class="keep-colors" viewBox="-3 6 738 483" width="738" height="483" role="img" aria-labelledby="connected-components-graph-t connected-components-graph-d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="connected-components-graph-t">The connectedComponentsGraph example graph</title>
  <desc id="connected-components-graph-d">Three disjoint subgraphs with 36 nodes in the components collection, connected by edges in the connections collection. A1 to A4 form a cycle. In B1 to B22, B7, B19, B17, B15, B14, B13, B12, B11, and B10 form a loop with branches to B1 to B6, B8, B9, B16, B18, and B20 to B22. C1 to C10 form a chain that splits at C4 into C5 and C7, which are also connected, and continues to C6 and to C8, C9, and C10. No edge connects nodes of different subgraphs.</desc>
