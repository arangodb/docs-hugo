<svg viewBox="0 0 820 376" width="820" height="376"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    .igdv text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .igdv .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .igdv .ptitle { font-size: 14px; font-weight: 600; fill: #1d293d; }
    .igdv .psub { font-size: 11px; fill: #45556c; }
    .igdv .grid { stroke: #e2e8f0; stroke-width: 1; }
    .igdv .axis { stroke: #90a1b9; stroke-width: 1; }
    .igdv .tick { font-size: 11px; fill: #45556c; }
    .igdv .bar { fill: #00576e; }
    .igdv .bar-over { fill: #bb4d00; }
    .igdv .threshold { stroke: #bb4d00; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .igdv .value { font-size: 12px; font-weight: 600; fill: #1d293d; }
    .igdv .value-over { font-size: 12px; font-weight: 600; fill: #bb4d00; }
    .igdv .event { font-size: 12px; font-weight: 600; fill: #1d293d; }
    .igdv .detail { font-size: 11px; fill: #45556c; }
    .igdv .legend { font-size: 11px; fill: #314158; }
  </style>
  <g class="igdv">
    <rect width="820" height="376" fill="#f1f5f9" rx="6"/>
    <rect class="panel" x="20" y="20" width="780" height="316" rx="8"/>
    <text class="ptitle" x="36" y="44" text-anchor="start">Divergence of one partition over time</text>
    <text class="psub" x="36" y="62" text-anchor="start">Entities added or removed since the communities were last organized, as a share of the entities at that time</text>
    <line class="grid" x1="90" y1="90" x2="780" y2="90"/>
    <line class="grid" x1="90" y1="135" x2="780" y2="135"/>
    <line class="grid" x1="90" y1="180" x2="780" y2="180"/>
    <line class="grid" x1="90" y1="225" x2="780" y2="225"/>
    <text class="tick" x="82" y="94" text-anchor="end">40%</text>
    <text class="tick" x="82" y="139" text-anchor="end">30%</text>
    <text class="tick" x="82" y="184" text-anchor="end">20%</text>
    <text class="tick" x="82" y="229" text-anchor="end">10%</text>
    <text class="tick" x="82" y="274" text-anchor="end">0%</text>
    <line class="threshold" x1="90" y1="157.5" x2="780" y2="157.5"/>
    <rect class="bar" x="144" y="268" width="64" height="2"/>
    <rect class="bar" x="317" y="180" width="64" height="90"/>
    <rect class="bar-over" x="489" y="144" width="64" height="126"/>
    <rect class="bar" x="662" y="268" width="64" height="2"/>
    <line class="axis" x1="90" y1="270" x2="780" y2="270"/>
    <text class="value" x="176" y="260" text-anchor="middle">0%</text>
    <text class="value" x="349" y="172" text-anchor="middle">20%</text>
    <text class="value-over" x="521" y="136" text-anchor="middle">28%</text>
    <text class="value" x="694" y="260" text-anchor="middle">0%</text>
    <text class="value-over" x="776" y="151" text-anchor="end">Threshold: 25%</text>
    <text class="event" x="176" y="292" text-anchor="middle">Built</text>
    <text class="detail" x="176" y="308" text-anchor="middle">1,000 entities</text>
    <text class="detail" x="176" y="323" text-anchor="middle">0 changed</text>
    <text class="event" x="349" y="292" text-anchor="middle">3 documents replaced</text>
    <text class="detail" x="349" y="308" text-anchor="middle">100 removed + 100 added</text>
    <text class="detail" x="349" y="323" text-anchor="middle">200 of 1,000 changed</text>
    <text class="event" x="521" y="292" text-anchor="middle">2 documents added</text>
    <text class="detail" x="521" y="308" text-anchor="middle">80 added</text>
    <text class="detail" x="521" y="323" text-anchor="middle">280 of 1,000 changed</text>
    <text class="event" x="694" y="292" text-anchor="middle">Reorganized</text>
    <text class="detail" x="694" y="308" text-anchor="middle">communities rebuilt</text>
    <text class="detail" x="694" y="323" text-anchor="middle">new starting point</text>
    <rect class="bar" x="21" y="350" width="12" height="12" rx="2"/>
    <text class="legend" x="40" y="360" text-anchor="start">below the threshold</text>
    <rect class="bar-over" x="171" y="350" width="12" height="12" rx="2"/>
    <text class="legend" x="190" y="360" text-anchor="start">above the threshold: reorganizing recommended</text>
    <line class="threshold" x1="471" y1="356" x2="497" y2="356"/>
    <text class="legend" x="505" y="360" text-anchor="start">threshold</text>
  </g>
</svg>
