version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@0.4.0
  trivy: arangodb/trivy-scan@1

parameters:
  workflow:
    type: enum
    enum: [no-op, plain-build, generate, release, compile, generate-scheduled, commit-generated, generate-oasisctl, create-docs-images-amd64, create-docs-images-arm64]
    default: no-op
  
  deploy-url:
    type: string
    default: $CIRCLE_BRANCH

  generators:
    type: string
    default: ""

  override:
    type: string
    default: ""

  # "all" or "changed" (see EXAMPLES_SCOPE in the README), empty for the default
  examples-scope:
    type: string
    default: ""

  arangodb-branch:
    type: string
    default: "undefined"

  arangodb-3_10:
    type: string
    default: "undefined"

  arangodb-3_11:
    type: string
    default: "undefined"

  arangodb-3_12:
    type: string
    default: "undefined"

  arangodb-4_x:
    type: string
    default: "undefined"

  commit-generated:
    type: boolean
    default: false

  create-pr:
    type: boolean
    default: False

  pr-branch:
    type: string
    default: ""

  release-type:
    type: enum
    enum: [arangodb, docs]
    default: docs

  arangodb-version:
    type: string
    default: ""
  
  docs-version:
    type: string
    default: ""


jobs:
  generate-config:
    docker:
      - image: cimg/python:3.14.3
    executor: continuation/default
    # The parameters as environment variables so that the shell doesn't interpret
    # them (they can come from PR descriptions), generate_config.py validates them
    environment:
      PARAM_WORKFLOW: << pipeline.parameters.workflow >>
      PARAM_ARANGODB_3_10: << pipeline.parameters.arangodb-3_10 >>
      PARAM_ARANGODB_3_11: << pipeline.parameters.arangodb-3_11 >>
      PARAM_ARANGODB_3_12: << pipeline.parameters.arangodb-3_12 >>
      PARAM_ARANGODB_4_X: << pipeline.parameters.arangodb-4_x >>
      PARAM_ARANGODB_BRANCH: << pipeline.parameters.arangodb-branch >>
      PARAM_RELEASE_TYPE: << pipeline.parameters.release-type >>
      PARAM_DOCS_VERSION: << pipeline.parameters.docs-version >>
      PARAM_ARANGODB_VERSION: << pipeline.parameters.arangodb-version >>
      PARAM_GENERATORS: << pipeline.parameters.generators >>
      PARAM_OVERRIDE: << pipeline.parameters.override >>
      PARAM_EXAMPLES_SCOPE: << pipeline.parameters.examples-scope >>
      PARAM_DEPLOY_URL: << pipeline.parameters.deploy-url >>
      PARAM_PR_BRANCH: << pipeline.parameters.pr-branch >>
    steps:
      - run:
          name: Checkout
          command: |
            mkdir -p .circleci && cd .circleci
            fetched=false
            for i in $(seq 1 5); do
              echo ""
              headers=$(mktemp)
              res=$(curl -sS -D "$headers" -H "Authorization: Bearer $CIRCLECI_GITHUB_READONLY" https://api.github.com/repos/arangodb/docs-hugo/contents/.circleci?ref=$CIRCLE_SHA1) || curlStatus=$?
              headers_content=$(cat "$headers")
              rm "$headers"
              if [[ -z "${curlStatus:-}" ]]; then
                urls=$(echo "$res" | jq ".[].download_url") || jqStatus=$?
                if [[ -z "${jqStatus:-}" ]]; then
                  fetched=true
                  break
                fi
                echo "jq failed with $jqStatus, input:"
                echo "$res"
              else
                echo "curl failed with $curlStatus, rate limit?"
                echo "$headers_content" | grep -i "ratelimit\|retry-after"
              fi
              unset curlStatus
              unset jqStatus
              sleep 60
            done
            if [[ "$fetched" = false ]]; then
              echo "Failed to fetch download URLs"
              exit 1
            fi
            echo "$urls" | xargs -n 1 curl -sS -O -H "Authorization: Bearer $CIRCLECI_GITHUB_READONLY"
            curl -sS -O -H "Authorization: Bearer $CIRCLECI_GITHUB_READONLY" https://raw.githubusercontent.com/arangodb/docs-hugo/$CIRCLE_SHA1/site/data/versions.yaml

            pip install pyyaml requests

            # Upstream references as VERSION=REF, VERSION being a name in versions.yaml
            python3 generate_config.py \
              --workflow="$PARAM_WORKFLOW" \
              --arangodb-branches 3.10="$PARAM_ARANGODB_3_10" 3.11="$PARAM_ARANGODB_3_11" 3.12="$PARAM_ARANGODB_3_12" 4.x="$PARAM_ARANGODB_4_X" \
              --arangodb-branch="$PARAM_ARANGODB_BRANCH" \
              --release-type="$PARAM_RELEASE_TYPE" \
              --docs-version="$PARAM_DOCS_VERSION" \
              --arangodb-version="$PARAM_ARANGODB_VERSION" \
              --generators="$PARAM_GENERATORS" \
              --override="$PARAM_OVERRIDE" \
              --examples-scope="$PARAM_EXAMPLES_SCOPE" \
              --deploy-url="$PARAM_DEPLOY_URL" \
              --pr-branch="$PARAM_PR_BRANCH"

            echo "Generated Configuration"
      - store_artifacts:
          path: /home/circleci/project/.circleci/generated_config.yml
      - continuation/continue:
          configuration_path: /home/circleci/project/.circleci/generated_config.yml # use newly generated config to continue

workflows:
  setup:
    jobs:
      - generate-config
      # Reports fixable CRITICAL/HIGH CVEs in the toolchain's dependency
      # manifests. Warn-only: findings do not fail the job. The job does fail
      # when the manifest it expects is no longer scanned, so the dependency
      # surface cannot silently drop out of scope.
      - trivy/scan-fs:
          name: dependency-cve-scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          report-severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          fail-on-findings: false
          expect-targets: toolchain/arangoproxy/go.mod
